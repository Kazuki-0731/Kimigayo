[pytest]
# Pytest configuration for Kimigayo OS

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage 設定は .coveragerc にある。
# coverage は pytest.ini を読まないため、ここに書いても効かない
# （[coverage:run] / [coverage:report] を書いていたが無効だった）。

# Markers
markers =
    property: Property-based tests
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests (deselect with '-m "not slow"')
    security: Security-related tests

# Hypothesis 設定は tests/conftest.py の settings.register_profile にある。
# hypothesis は ini ファイルを読まないため、ここに [hypothesis] を書いても
# 効かない（verbosity / max_examples を書いていたが無効だった）。
# プロファイルの切り替え: HYPOTHESIS_PROFILE=ci pytest ...
