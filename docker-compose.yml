services:
  kimigayo-build:
    platform: linux/amd64  # x86_64アーキテクチャを強制（Apple Siliconでも動作）
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # versions.mk / git タグ由来。Makefile が export して渡す。
        ALPINE_VERSION: "${ALPINE_VERSION:-3.24}"
        KIMIGAYO_VERSION: "${KIMIGAYO_VERSION:-dev}"
    image: kimigayo-os-build:latest
    container_name: kimigayo-build-env
    volumes:
      # ソースコードをマウント
      - .:/build/kimigayo:rw
      # ビルド出力を永続化
      - kimigayo-output:/output
      # ダウンロードキャッシュを永続化（ローカルビルド高速化）
      # カーネル、musl、BusyBox、OpenRCのソースtarballをキャッシュ
      - kimigayo-downloads:/build/kimigayo/build/downloads
      # Dockerソケットをマウント（テスト用）
      - /var/run/docker.sock:/var/run/docker.sock:ro
    working_dir: /build/kimigayo/build-system
    stdin_open: true
    tty: true
    environment:
      - KIMIGAYO_VERSION=${KIMIGAYO_VERSION:-dev}
      - ARCH=x86_64
      - SECURITY_HARDENING=full
    # リソース制限
    #
    # memory は 8G。2G だと arm64 のクロスビルドで meson setup が
    # OOM kill される（`Killed` だけ出て原因が分かりにくい）。
    # 開発機が Apple Silicon のとき、この amd64 コンテナは QEMU
    # エミュレーションで動くため、ネイティブより多くのメモリを使う。
    # CI（ubuntu-latest, x86_64 ネイティブ）では問題にならないが、
    # 手元と CI で同じ compose を使うので手元に合わせる。
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 512M
          cpus: '2'

volumes:
  kimigayo-output:
    driver: local
  # ダウンロードしたソースコードを永続化（再ビルド時にダウンロードをスキップ）
  kimigayo-downloads:
    driver: local
