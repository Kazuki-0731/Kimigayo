name: Manual Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'standard'
        type: choice
        options:
          - minimal
          - standard
          - extended
      arch:
        description: 'Target architecture'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - arm64

      build_kernel:
        description: 'カーネルもビルドする（イメージには入らない。ベアメタル／QEMU 検証用）'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-workflow.yml
    with:
      variant: ${{ inputs.variant }}
      arch: ${{ inputs.arch }}
      build_kernel: ${{ inputs.build_kernel }}
      upload_artifacts: true

  # security ジョブは外した。
  # 当時の make security-scan は trivy-scan（イメージスキャン）を含んでいたが
  # （2026-10-11 に scan-image へ置き換え。いまは build-workflow.yml が
  # 秘密情報と CVE の照合（scripts/scan-image.sh）を走らせる）、
  # Kimigayo は scratch 上の手組み rootfs でパッケージデータベースを
  # 持たないため Trivy は対象を1つも識別できない（実測で
  # Target: - / Not scanned / Metadata.OS: null / Results: 0）。
  # 「脆弱性 0 件」ではなく「スキャンしていない」ので、走らせると
  # 誤った安心を与える。そもそもこのジョブは needs: build を
  # 付けておらず、イメージが存在しない状態で走っていた。
  # ファイルシステムスキャンは build-and-verify.yml と security.yml が担当する。
  # → CLAUDE.md「セキュリティ」節、.claude/skills/security-review/
