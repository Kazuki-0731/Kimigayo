name: Dependency Review

on:
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly vulnerability scan
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: 'vuln,secret,config'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # シェルスクリプトの静的な点検。**当たれば落とす。**
      #
      # 以前は毎回 ⚠️ を出しながら一度も失敗しない作りで、
      # check-links.py のコメント中の http:// と versions.sh の eval に
      # 毎回当たっていた。警告が常に出るので「✅」も「⚠️」も意味を持たなかった。
      #
      # いまはコメント行を除いたシェルスクリプトだけを見て、既知の安全な
      # 箇所だけを許可リストで外す。秘密情報の検出は上の Trivy
      # （scanners: secret）と scripts/scan-image.sh が受け持つので、ここではやらない。
      - name: Check shell scripts for insecure downloads and eval
        run: |
          set -euo pipefail
          files=(scripts/*.sh scripts/lib/*.sh .claude/hooks/*.sh)
          found=0

          # コメント行（先頭が #）を除いた http://（localhost は除く）
          if grep -nE 'http://' "${files[@]}" \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
               | grep -v 'http://localhost'; then
            echo "::error::http:// の URL がある（https にする）"
            found=1
          fi

          # eval。許可リスト:
          #   scripts/lib/versions.sh — versions.mk の "NAME ?= value" を
          #   sed で NAME="${NAME:-value}" に変換したものだけを eval する
          if grep -nwE 'eval' "${files[@]}" \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
               | grep -vE '^scripts/lib/versions\.sh:'; then
            echo "::error::eval がある（必要なら理由を書いて許可リストに足す）"
            found=1
          fi

          exit "$found"

      - name: Upload dependency report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dependency-scan-report
          path: trivy-results.sarif
          retention-days: 30

  # **公開中のイメージ**の構成要素を CVE と照合する。
  #
  # 以前ここには「Check component versions against CVE databases」という
  # ステップがあったが、CVE データベースを一切照会しておらず
  # （"In production, you would query CVE databases here"）、
  # versions.mk の版を表示しているだけだった。しかも versions.mk は
  # 宣言であって、出荷物の版ではない。
  #
  # いまは Docker Hub から実際に pull し、イメージ内のバイナリから読んだ版で
  # SBOM を作って Grype で照合する（scripts/scan-image.sh）。
  # 新しい CVE はコードが変わらなくても出るので、push ではなく定期で回す。
  # 見つかれば失敗し、create-security-issue が Issue を起票する。
  #
  # 構成要素の版はバリアント・アーキで共通なので、latest（standard /
  # amd64）だけを見る。
  published-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Pull the published image
        run: docker pull --platform linux/amd64 ishinokazuki/kimigayo-os:latest

      - name: Scan the published image (CVE + secrets)
        env:
          SBOM_OUT: ${{ github.workspace }}/sbom/kimigayo-latest-x86_64.cdx.json
        run: |
          bash scripts/scan-image.sh ishinokazuki/kimigayo-os:latest standard x86_64

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom-published-latest
          path: sbom/
          retention-days: 30
          if-no-files-found: ignore

  create-security-issue:
    needs: [vulnerability-scan, published-image-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: failure() && github.event_name == 'schedule'

    steps:
      - name: Create security issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const issueTitle = `🔒 Weekly Security Scan Failed - ${new Date().toISOString().split('T')[0]}`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.startsWith('🔒 Weekly Security Scan Failed')
            );

            const issueBody = `## Weekly Security Scan Failed

            The automated weekly security scan has detected issues.

            ### Details

            - **Workflow Run**: [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            - **Date**: ${new Date().toISOString().split('T')[0]}

            ### Action Required

            1. published-image-scan ジョブのログを見る（scripts/scan-image.sh が公開中の latest を Grype で照合した結果。SBOM は artifact の sbom-published-latest）
            2. 出た CVE が本当に該当するかを確かめる（.claude/skills/security-review/SKILL.md）
            3. 該当するなら構成要素の版上げかパッチで対応する
            4. Trivy（リポジトリのファイルシステム）の結果は Security タブにあるが、失敗させない設定なので通常この Issue の原因ではない

            ### Resources

            - [Security Policy](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/security/SECURITY_POLICY.md)
            - [NVD](https://nvd.nist.gov/)

            🤖 This issue was automatically created by the dependency review workflow.`;

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['security', 'automated']
              });
            }
