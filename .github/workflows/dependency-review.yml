name: Dependency Review

on:
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly vulnerability scan
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: 'vuln,secret,config'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # シェルスクリプトの静的な点検。**当たれば落とす。**
      #
      # 以前は毎回 ⚠️ を出しながら一度も失敗しない作りで、
      # check-links.py のコメント中の http:// と versions.sh の eval に
      # 毎回当たっていた。警告が常に出るので「✅」も「⚠️」も意味を持たなかった。
      #
      # いまはコメント行を除いたシェルスクリプトだけを見て、既知の安全な
      # 箇所だけを許可リストで外す。秘密情報の検出は上の Trivy
      # （scanners: secret）と scripts/scan-image.sh が受け持つので、ここではやらない。
      - name: Check shell scripts for insecure downloads and eval
        run: |
          set -euo pipefail
          files=(scripts/*.sh scripts/lib/*.sh .claude/hooks/*.sh)
          found=0

          # コメント行（先頭が #）を除いた http://（localhost は除く）
          if grep -nE 'http://' "${files[@]}" \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
               | grep -v 'http://localhost'; then
            echo "::error::http:// の URL がある（https にする）"
            found=1
          fi

          # eval。許可リスト:
          #   scripts/lib/versions.sh — versions.mk の "NAME ?= value" を
          #   sed で NAME="${NAME:-value}" に変換したものだけを eval する
          if grep -nwE 'eval' "${files[@]}" \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
               | grep -vE '^scripts/lib/versions\.sh:'; then
            echo "::error::eval がある（必要なら理由を書いて許可リストに足す）"
            found=1
          fi

          exit "$found"

      - name: Upload dependency report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-scan-report
          path: trivy-results.sarif
          retention-days: 30

  # **公開中のイメージ**の構成要素を CVE と照合する。
  #
  # 以前ここには「Check component versions against CVE databases」という
  # ステップがあったが、CVE データベースを一切照会しておらず
  # （"In production, you would query CVE databases here"）、
  # versions.mk の版を表示しているだけだった。しかも versions.mk は
  # 宣言であって、出荷物の版ではない。
  #
  # いまは Docker Hub から実際に pull し、イメージ内のバイナリから読んだ版で
  # SBOM を作って Grype で照合する（scripts/scan-image.sh）。
  # 新しい CVE はコードが変わらなくても出るので、push ではなく定期で回す。
  # 見つかれば失敗し、add-to-project が非公開の Project に項目を足す。
  #
  # 構成要素の版はバリアント・アーキで共通なので、latest（standard /
  # amd64）だけを見る。
  published-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull the published image
        run: docker pull --platform linux/amd64 ishinokazuki/kimigayo-os:latest

      - name: Scan the published image (CVE + secrets)
        env:
          SBOM_OUT: ${{ github.workspace }}/sbom/kimigayo-latest-x86_64.cdx.json
        run: |
          bash scripts/scan-image.sh ishinokazuki/kimigayo-os:latest standard x86_64

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-published-latest
          path: sbom/
          retention-days: 30
          if-no-files-found: ignore

  # 公開中のイメージに CVE が見つかったら、公開の Issue ではなく非公開の Project に
  # 足す。「公開イメージに当たっていて、まだ直っていない」ことは攻撃の手がかりになる
  # （CLAUDE.md「危険度の高いものは Issue にしない」節）。Project への書き込みは
  # GITHUB_TOKEN では届かないので secrets.KIMIGAYO_PROJECT_TOKEN を使う。
  #
  # vulnerability-scan（リポジトリのファイルシステム）だけが落ちたときは
  # ここでは扱わない。中身は公開されているコードの点検で、実行ログで見る。
  add-to-project:
    needs: [published-image-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: failure() && needs.published-image-scan.result == 'failure' && github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add the finding to the private Project
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT_ID: ${{ vars.KIMIGAYO_PROJECT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.KIMIGAYO_PROJECT_TOKEN }}
          script: |
            const project = require('./.github/scripts/project-draft.js');
            const id = process.env.PROJECT_ID;
            const state = await project.load(github, id);
            const date = new Date().toISOString().split('T')[0];
            // 週ごとに 1 件。同じ週に手動で回し直しても重ねない。
            const key = `published-image-scan:${date.slice(0, 8)}${Math.ceil(Number(date.slice(8)) / 7)}`;
            if (state.seen.has(key)) { core.info(`${key} は Project にある`); return; }
            await project.add(github, id, state, {
              title: `🔒 公開中の latest に CVE（${date}）`,
              body: [
                '毎週の published-image-scan（scripts/scan-image.sh が公開中の latest を Grype で照合）が CVE を見つけた。',
                '',
                `- 実行: ${process.env.RUN_URL}（SBOM は artifact の sbom-published-latest）`,
                '- 本当に当たるかを確かめる（.claude/skills/security-review/SKILL.md）',
                '- 当たるなら構成要素の版上げかパッチで直し、docs/security/upstream-triage.tsv に仕分ける',
                '- 直してリリースしたら、CHANGELOG・RELEASE_NOTES で公開する',
                '',
                `<!-- key:${key} -->`,
              ].join('\n'),
              priority: 'High',
            });
