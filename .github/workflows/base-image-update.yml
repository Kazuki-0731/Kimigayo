name: Base Image Update

on:
  schedule:
    # Run weekly on Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '更新が無くても PR を作る（空コミット。ワークフロー自体の動作確認用）'
        type: boolean
        required: false
        default: false

# packages: write は付けない。このワークフローはイメージを push しない。
# actions: write は PR ブランチで ci.yml を workflow_dispatch するために要る
# （→ create-update-pr の最後のステップ）。
permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: base-image-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 後段が使う値はすべてここで宣言する。
    #
    # 2026-10-12 まで *_current / *_latest を宣言していなかったため、
    # 後段では空文字列になっていた。上流に新版が出た週は versions.mk を
    # **空の版**で sed 置換し、本文に「BusyBox:  → 」と書いた PR を
    # 作っていた（PR #111）。宣言していない output は黙って空になる。
    outputs:
      musl_update: ${{ steps.check.outputs.musl_update }}
      musl_current: ${{ steps.check.outputs.musl_current }}
      musl_latest: ${{ steps.check.outputs.musl_latest }}
      busybox_update: ${{ steps.check.outputs.busybox_update }}
      busybox_current: ${{ steps.check.outputs.busybox_current }}
      busybox_latest: ${{ steps.check.outputs.busybox_latest }}
      openrc_update: ${{ steps.check.outputs.openrc_update }}
      openrc_current: ${{ steps.check.outputs.openrc_current }}
      openrc_latest: ${{ steps.check.outputs.openrc_latest }}
      should_rebuild: ${{ steps.check.outputs.should_rebuild }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for component updates
        id: check
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          # 現在のバージョンは versions.mk（単一の真実の源）から読む。
          #
          # 以前は scripts/build-rootfs.sh を grep していたが、そこに
          # MUSL_VERSION= / BUSYBOX_VERSION= / OPENRC_VERSION= は存在せず、
          # CURRENT_* が常に空になっていた。空 != 最新 は常に真なので、
          # 毎週「中身が空の更新PR」が作られ続けていた。
          # shellcheck disable=SC1091
          source scripts/lib/versions.sh

          CURRENT_MUSL="$MUSL_VERSION"
          CURRENT_BUSYBOX="$BUSYBOX_VERSION"
          CURRENT_OPENRC="$OPENRC_VERSION"

          # Check musl libc
          LATEST_MUSL=$(curl -sL https://musl.libc.org/releases.html \
            | grep -oP 'musl-\K[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || echo "$CURRENT_MUSL")
          [ -n "$LATEST_MUSL" ] || LATEST_MUSL="$CURRENT_MUSL"

          # Check BusyBox
          LATEST_BUSYBOX=$(curl -sL https://busybox.net/downloads/ | grep -oP 'busybox-\K[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || echo "$CURRENT_BUSYBOX")
          [ -n "$LATEST_BUSYBOX" ] || LATEST_BUSYBOX="$CURRENT_BUSYBOX"

          # Check OpenRC
          # OpenRC は公式のリリース一覧ページを持たないため、Alpine aports の
          # pkgver を上流の最新版として扱う（チェックサムもここと突合している）。
          LATEST_OPENRC=$(curl -sL https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/openrc/APKBUILD \
            | grep -oP '^pkgver=\K[0-9.]+' | head -1 || echo "$CURRENT_OPENRC")
          [ -n "$LATEST_OPENRC" ] || LATEST_OPENRC="$CURRENT_OPENRC"

          any_update=false
          # current と latest は更新の有無に関わらず出す（後段で空にしない）。
          report() {
            local key="$1" label="$2" current="$3" latest="$4"
            echo "Current ${label}: ${current}, Latest: ${latest}"
            {
              echo "${key}_current=${current}"
              echo "${key}_latest=${latest}"
            } >> "$GITHUB_OUTPUT"
            if [ "$current" != "$latest" ]; then
              echo "${key}_update=true" >> "$GITHUB_OUTPUT"
              any_update=true
            else
              echo "${key}_update=false" >> "$GITHUB_OUTPUT"
            fi
          }

          report musl "musl" "$CURRENT_MUSL" "$LATEST_MUSL"
          report busybox "BusyBox" "$CURRENT_BUSYBOX" "$LATEST_BUSYBOX"
          report openrc "OpenRC" "$CURRENT_OPENRC" "$LATEST_OPENRC"

          if [ "$FORCE_REBUILD" = "true" ] || [ "$any_update" = "true" ]; then
            echo "should_rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_rebuild=false" >> "$GITHUB_OUTPUT"
          fi

  create-update-pr:
    needs: check-updates
    if: needs.check-updates.outputs.should_rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 値は ${{ }} を run に直接埋め込まず env で渡す。
      - name: Update component versions
        id: update
        env:
          MUSL_UPDATE: ${{ needs.check-updates.outputs.musl_update }}
          MUSL_CURRENT: ${{ needs.check-updates.outputs.musl_current }}
          MUSL_LATEST: ${{ needs.check-updates.outputs.musl_latest }}
          BUSYBOX_UPDATE: ${{ needs.check-updates.outputs.busybox_update }}
          BUSYBOX_CURRENT: ${{ needs.check-updates.outputs.busybox_current }}
          BUSYBOX_LATEST: ${{ needs.check-updates.outputs.busybox_latest }}
          OPENRC_UPDATE: ${{ needs.check-updates.outputs.openrc_update }}
          OPENRC_CURRENT: ${{ needs.check-updates.outputs.openrc_current }}
          OPENRC_LATEST: ${{ needs.check-updates.outputs.openrc_latest }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          BRANCH_NAME="automated/base-image-update-$(date +%Y%m%d-%H%M)"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

          # PR 本文はリポジトリに置かない（以前は UPDATES.md をルートに
          # コミットしていた）。ランナーの一時領域に書いて次のステップで使う。
          body="${RUNNER_TEMP}/pr-body.md"
          changes="${RUNNER_TEMP}/changes.md"
          : > "$changes"

          # バージョンは versions.mk（単一の真実の源）だけを書き換える。
          # "NAME ?= value" 形式なので、その行の値だけを差し替える。
          #
          # **値が空・版の形でない・新しくない・置換が効かなかった、の
          # どれでも止める。** 黙って進むと versions.mk を空の版で
          # 書き換えた PR ができる（PR #111）。
          bump() {
            local name="$1" label="$2" current="$3" latest="$4"
            if [ -z "$current" ] || [ -z "$latest" ]; then
              echo "::error::${name}: current='${current}' latest='${latest}'（空の値。check-updates の outputs を確認する）"
              exit 1
            fi
            if ! printf '%s\n' "$latest" | grep -qE '^[0-9]+(\.[0-9]+)+$'; then
              echo "::error::${name}: latest='${latest}' は版の形をしていない"
              exit 1
            fi
            if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" != "$latest" ] \
               || [ "$current" = "$latest" ]; then
              echo "::error::${name}: ${latest} は ${current} より新しくない（上流の取得元を確認する）"
              exit 1
            fi
            sed -i -E "s|^(${name}[[:space:]]*\?=[[:space:]]*).*$|\1${latest}|" versions.mk
            if ! grep -qE "^${name}[[:space:]]*\?=[[:space:]]*${latest//./\\.}$" versions.mk; then
              echo "::error::${name}: versions.mk の置換が効かなかった"
              exit 1
            fi
            echo "- **${label}**: ${current} → ${latest}" >> "$changes"
            echo "✅ ${name}: ${current} -> ${latest}"
          }

          [ "$MUSL_UPDATE" != "true" ] || bump MUSL_VERSION "musl libc" "$MUSL_CURRENT" "$MUSL_LATEST"
          [ "$BUSYBOX_UPDATE" != "true" ] || bump BUSYBOX_VERSION "BusyBox" "$BUSYBOX_CURRENT" "$BUSYBOX_LATEST"
          [ "$OPENRC_UPDATE" != "true" ] || bump OPENRC_VERSION "OpenRC" "$OPENRC_CURRENT" "$OPENRC_LATEST"

          echo "--- versions.mk after bump ---"
          grep -E '^[A-Z_]+[[:space:]]*\?=' versions.mk

          if [ -s "$changes" ]; then
            git add versions.mk
            git commit -m "⬆️ 構成要素の版を上流の最新に合わせる（自動検知）

          $(cat "$changes")"
          else
            # force_rebuild で更新が無いとき。差分の無い PR は作れないので空コミットにする。
            echo "- 更新なし（force_rebuild による動作確認）" >> "$changes"
            git commit --allow-empty -m "🔧 構成要素の更新ワークフローの動作確認（更新なし）"
          fi

          git push -u origin "$BRANCH_NAME"

          cat > "$body" <<EOF
          ## 構成要素の更新（自動作成）

          上流の新しい版を検知したので、\`versions.mk\` の版を更新する。

          ### 変更

          $(cat "$changes")

          ### CI

          GITHUB_TOKEN で作った PR では \`ci.yml\` が自動で起動しないため、
          **このワークフローがこのブランチで \`ci.yml\` を workflow_dispatch で起動している。**
          結果: ${REPO_URL}/actions/workflows/ci.yml?query=branch%3A${BRANCH_NAME//\//%2F}

          \`ci.yml\` はカーネルを作らない。カーネルの版は自動検知の対象外。

          ### ⚠️ この PR だけでは完結しない

          **チェックサムは自動で更新していない。** マージする前に
          \`scripts/download-*.sh\` のチェックサム表に新しい版を追加すること。
          値は上流の公開値、または Alpine aports の \`sha512sums\` と突合してから書く。

          **上流のビルドオプションが消えていないかも確認する。**
          過去に OpenRC の \`-Dos=Linux\` が削除されて \`meson setup\` が
          失敗した前例がある（CLAUDE.md「版上げで実際に壊れた箇所」節）。

          ### 確認すること

          - [ ] \`scripts/download-*.sh\` のチェックサム表を更新した
          - [ ] 上流の NEWS / Changelog を読んだ
          - [ ] 上記の \`ci.yml\` が全バリアント × 両アーキで通った
          - [ ] \`build/busybox-patches.log\` に \`skipped: [1-9]\` や \`not applicable\` が無い
          - [ ] 性能が退行していない

          ### 参考

          - musl libc releases: https://musl.libc.org/releases.html
          - BusyBox releases: https://busybox.net/downloads/
          - OpenRC (Alpine aports): https://gitlab.alpinelinux.org/alpine/aports/-/blob/master/main/openrc/APKBUILD

          この PR は \`.github/workflows/base-image-update.yml\` が自動で作成した。
          EOF

          cat "$body"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.update.outputs.branch }}
        run: |
          set -euo pipefail
          gh pr create \
            --title "⬆️ 構成要素の版を更新 - $(date +%Y-%m-%d)" \
            --body-file "${RUNNER_TEMP}/pr-body.md" \
            --label "dependencies,automated" \
            --base main \
            --head "$BRANCH_NAME"

      # GITHUB_TOKEN による push / PR 作成はワークフローを起動しない
      # （無限ループ防止の仕様）。workflow_dispatch だけは例外なので、
      # PR ブランチで ci.yml を明示的に起動する。失敗したらこのジョブを落とす。
      - name: Trigger CI on the PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.update.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$BRANCH_NAME"
          echo "::notice::ci.yml を ${BRANCH_NAME} で起動した"
