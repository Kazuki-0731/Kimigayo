name: Base Image Update

on:
  schedule:
    # Run weekly on Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if no updates detected'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  DOCKER_HUB_USERNAME: ishinokazuki
  IMAGE_NAME: kimigayo-os

concurrency:
  group: base-image-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      musl_update: ${{ steps.check.outputs.musl_update }}
      busybox_update: ${{ steps.check.outputs.busybox_update }}
      openrc_update: ${{ steps.check.outputs.openrc_update }}
      should_rebuild: ${{ steps.check.outputs.should_rebuild }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for component updates
        id: check
        run: |
          # 現在のバージョンは versions.mk（単一の真実の源）から読む。
          #
          # 以前は scripts/build-rootfs.sh を grep していたが、そこに
          # MUSL_VERSION= / BUSYBOX_VERSION= / OPENRC_VERSION= は存在せず、
          # CURRENT_* が常に空になっていた。空 != 最新 は常に真なので、
          # 毎週「中身が空の更新PR」が作られ続けていた。
          # shellcheck disable=SC1091
          source scripts/lib/versions.sh

          CURRENT_MUSL="$MUSL_VERSION"
          CURRENT_BUSYBOX="$BUSYBOX_VERSION"
          CURRENT_OPENRC="$OPENRC_VERSION"

          # Check musl libc
          LATEST_MUSL=$(curl -sL https://musl.libc.org/releases.html \
            | grep -oP 'musl-\K[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || echo "$CURRENT_MUSL")
          [ -n "$LATEST_MUSL" ] || LATEST_MUSL="$CURRENT_MUSL"

          echo "Current musl: $CURRENT_MUSL, Latest: $LATEST_MUSL"

          if [ "$CURRENT_MUSL" != "$LATEST_MUSL" ]; then
            echo "musl_update=true" >> $GITHUB_OUTPUT
            echo "musl_current=$CURRENT_MUSL" >> $GITHUB_OUTPUT
            echo "musl_latest=$LATEST_MUSL" >> $GITHUB_OUTPUT
          else
            echo "musl_update=false" >> $GITHUB_OUTPUT
          fi

          # Check BusyBox
          LATEST_BUSYBOX=$(curl -sL https://busybox.net/downloads/ | grep -oP 'busybox-\K[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || echo "$CURRENT_BUSYBOX")
          [ -n "$LATEST_BUSYBOX" ] || LATEST_BUSYBOX="$CURRENT_BUSYBOX"

          echo "Current BusyBox: $CURRENT_BUSYBOX, Latest: $LATEST_BUSYBOX"

          if [ "$CURRENT_BUSYBOX" != "$LATEST_BUSYBOX" ]; then
            echo "busybox_update=true" >> $GITHUB_OUTPUT
            echo "busybox_current=$CURRENT_BUSYBOX" >> $GITHUB_OUTPUT
            echo "busybox_latest=$LATEST_BUSYBOX" >> $GITHUB_OUTPUT
          else
            echo "busybox_update=false" >> $GITHUB_OUTPUT
          fi

          # Check OpenRC
          # OpenRC は公式のリリース一覧ページを持たないため、Alpine aports の
          # pkgver を上流の最新版として扱う（チェックサムもここと突合している）。
          LATEST_OPENRC=$(curl -sL https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/openrc/APKBUILD \
            | grep -oP '^pkgver=\K[0-9.]+' | head -1 || echo "$CURRENT_OPENRC")
          [ -n "$LATEST_OPENRC" ] || LATEST_OPENRC="$CURRENT_OPENRC"

          echo "Current OpenRC: $CURRENT_OPENRC, Latest: $LATEST_OPENRC"

          if [ "$CURRENT_OPENRC" != "$LATEST_OPENRC" ]; then
            echo "openrc_update=true" >> $GITHUB_OUTPUT
            echo "openrc_current=$CURRENT_OPENRC" >> $GITHUB_OUTPUT
            echo "openrc_latest=$LATEST_OPENRC" >> $GITHUB_OUTPUT
          else
            echo "openrc_update=false" >> $GITHUB_OUTPUT
          fi

          # Determine if rebuild is needed
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ] || \
             [ "$CURRENT_MUSL" != "$LATEST_MUSL" ] || \
             [ "$CURRENT_BUSYBOX" != "$LATEST_BUSYBOX" ] || \
             [ "$CURRENT_OPENRC" != "$LATEST_OPENRC" ]; then
            echo "should_rebuild=true" >> $GITHUB_OUTPUT
          else
            echo "should_rebuild=false" >> $GITHUB_OUTPUT
          fi

  create-update-pr:
    needs: check-updates
    if: needs.check-updates.outputs.should_rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update component versions
        id: update
        run: |
          BRANCH_NAME="automated/base-image-update-$(date +%Y%m%d-%H%M)"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete remote branch if it exists
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

          # Create new branch
          git checkout -b "$BRANCH_NAME"

          # バージョンは versions.mk（単一の真実の源）だけを書き換える。
          # "NAME ?= value" 形式なので、その行の値だけを差し替える。
          bump() {
            local name="$1" latest="$2"
            sed -i -E "s|^(${name}[[:space:]]*\?=[[:space:]]*).*$|\1${latest}|" versions.mk
            echo "✅ ${name} -> ${latest}"
          }

          if [ "${{ needs.check-updates.outputs.musl_update }}" = "true" ]; then
            bump MUSL_VERSION "${{ needs.check-updates.outputs.musl_latest }}"
          fi

          if [ "${{ needs.check-updates.outputs.busybox_update }}" = "true" ]; then
            bump BUSYBOX_VERSION "${{ needs.check-updates.outputs.busybox_latest }}"
          fi

          if [ "${{ needs.check-updates.outputs.openrc_update }}" = "true" ]; then
            bump OPENRC_VERSION "${{ needs.check-updates.outputs.openrc_latest }}"
          fi

          echo "--- versions.mk after bump ---"
          grep -E '^[A-Z_]+[[:space:]]*\?=' versions.mk

          # Create changelog entry
          cat > UPDATES.md << EOF
          # Base Image Updates - $(date +%Y-%m-%d)

          ## Updated Components

          EOF

          if [ "${{ needs.check-updates.outputs.musl_update }}" = "true" ]; then
            echo "- **musl libc**: ${{ needs.check-updates.outputs.musl_current }} → ${{ needs.check-updates.outputs.musl_latest }}" >> UPDATES.md
          fi

          if [ "${{ needs.check-updates.outputs.busybox_update }}" = "true" ]; then
            echo "- **BusyBox**: ${{ needs.check-updates.outputs.busybox_current }} → ${{ needs.check-updates.outputs.busybox_latest }}" >> UPDATES.md
          fi

          if [ "${{ needs.check-updates.outputs.openrc_update }}" = "true" ]; then
            echo "- **OpenRC**: ${{ needs.check-updates.outputs.openrc_current }} → ${{ needs.check-updates.outputs.openrc_latest }}" >> UPDATES.md
          fi

          cat >> UPDATES.md << EOF

          ## ⚠️ このPRだけでは完結しない

          **チェックサムは自動で更新していない。** マージする前に
          \`scripts/download-*.sh\` のチェックサム表に新しい版を追加すること。
          追加しないと「既知のチェックサムが無い」警告が出たまま通ってしまう。
          値は上流の公開値、または Alpine aports の \`sha512sums\` と突合してから書く。

          **上流のビルドオプションが消えていないかも確認する。**
          過去に OpenRC の \`-Dos=Linux\` が削除されて \`meson setup\` が
          失敗した前例がある（CLAUDE.md「版上げで実際に壊れた箇所」節）。

          ## Testing Required

          - [ ] \`scripts/download-*.sh\` のチェックサム表を更新した
          - [ ] Build all variants (minimal, standard, extended)
          - [ ] \`build/kernel-patches.log\` / \`build/busybox-patches.log\` に
                \`skipped:\` が無いことを確認した
          - [ ] Run integration tests
          - [ ] Run security scans
          - [ ] Verify Docker image functionality

          ## Related Links

          - musl libc releases: https://musl.libc.org/releases.html
          - BusyBox releases: https://busybox.net/downloads/
          - OpenRC (Alpine aports): https://gitlab.alpinelinux.org/alpine/aports/-/blob/master/main/openrc/APKBUILD
          - Linux kernel: https://www.kernel.org/releases.json
          EOF

          cat UPDATES.md

          git add versions.mk UPDATES.md
          git commit -m "⬆️ Update base image components

          $(cat UPDATES.md)

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: Claude <noreply@anthropic.com>"

          git push -u origin "$BRANCH_NAME"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build PR body
          PR_BODY="## Automated Base Image Update

          This PR updates core components to their latest versions.

          ### Changes
          "

          if [ "${{ needs.check-updates.outputs.musl_update }}" = "true" ]; then
            PR_BODY="${PR_BODY}
          - musl libc: ${{ needs.check-updates.outputs.musl_current }} → ${{ needs.check-updates.outputs.musl_latest }}"
          fi

          if [ "${{ needs.check-updates.outputs.busybox_update }}" = "true" ]; then
            PR_BODY="${PR_BODY}
          - BusyBox: ${{ needs.check-updates.outputs.busybox_current }} → ${{ needs.check-updates.outputs.busybox_latest }}"
          fi

          if [ "${{ needs.check-updates.outputs.openrc_update }}" = "true" ]; then
            PR_BODY="${PR_BODY}
          - OpenRC: ${{ needs.check-updates.outputs.openrc_current }} → ${{ needs.check-updates.outputs.openrc_latest }}"
          fi

          PR_BODY="${PR_BODY}

          ### Testing Checklist

          - [ ] scripts/download-*.sh のチェックサム表を更新した（自動更新されない）
          - [ ] 上流のビルドオプションが消えていないか確認した
          - [ ] All variants build successfully (minimal, standard, extended)
          - [ ] Integration tests pass
          - [ ] Security scans pass (Trivy)
          - [ ] Docker images functional
          - [ ] No performance regressions

          ### Notes

          - This PR was automatically created by the base image update workflow
          - Please review changelog and test thoroughly before merging
          - Security scans will run automatically on this PR

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"

          # Create PR using gh CLI
          gh pr create \
            --title "⬆️ Update base image components - $(date +%Y-%m-%d)" \
            --body "$PR_BODY" \
            --label "dependencies,automated" \
            --base main

  # Note: Full build testing is done in the PR's CI/CD pipeline
  # This workflow only creates the update PR
