name: Security

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# issues: write は付けない。見つけたものは公開の Issue ではなく非公開の Project に
# 足す（CLAUDE.md「危険度の高いものは Issue にしない」節）。Project への書き込みは
# GITHUB_TOKEN では届かないので、secrets.KIMIGAYO_PROJECT_TOKEN（classic PAT の
# project スコープだけ）を使う。足す先は vars.KIMIGAYO_PROJECT_ID。
permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_HUB_USERNAME: ishinokazuki
  IMAGE_NAME: kimigayo-os

jobs:
  version-check:
    name: Check Component Versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      musl_update: ${{ steps.musl_check.outputs.update_needed }}
      busybox_update: ${{ steps.busybox_check.outputs.update_needed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Alpine の secdb を数えるステップは削除した（2026-10-12）。
      # jq 'length' はトップレベルのキー数（常に 6）を数えていただけで、
      # しかも Alpine のパッケージは出荷物に入らない（Alpine はビルド環境）。
      # 出荷物の CVE は scripts/scan-image.sh が見る（build-and-verify.yml・release.yml・
      # dependency-review.yml の published-image-scan）。

      - name: Check musl libc updates
        id: musl_check
        run: |
          # 現在のバージョンは versions.mk（単一の真実の源）から読む。
          # 以前は scripts/build-rootfs.sh を grep していたが、そこに
          # MUSL_VERSION= は存在せず常に空だったため、毎日「更新が必要」と
          # 報告し続けていた。
          # shellcheck disable=SC1091
          source scripts/lib/versions.sh
          CURRENT_MUSL="$MUSL_VERSION"
          LATEST_MUSL=$(curl -sL https://musl.libc.org/releases.html \
            | grep -oP 'musl-\K[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || echo "$CURRENT_MUSL")
          [ -n "$LATEST_MUSL" ] || LATEST_MUSL="$CURRENT_MUSL"

          echo "Current musl: $CURRENT_MUSL, Latest: $LATEST_MUSL"
          echo "current=$CURRENT_MUSL" >> $GITHUB_OUTPUT
          echo "latest=$LATEST_MUSL" >> $GITHUB_OUTPUT

          if [ "$CURRENT_MUSL" != "$LATEST_MUSL" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check BusyBox updates
        id: busybox_check
        run: |
          # shellcheck disable=SC1091
          source scripts/lib/versions.sh
          CURRENT_BUSYBOX="$BUSYBOX_VERSION"
          LATEST_BUSYBOX=$(curl -sL https://busybox.net/downloads/ | grep -oP 'busybox-\K[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || echo "$CURRENT_BUSYBOX")
          [ -n "$LATEST_BUSYBOX" ] || LATEST_BUSYBOX="$CURRENT_BUSYBOX"

          echo "Current BusyBox: $CURRENT_BUSYBOX, Latest: $LATEST_BUSYBOX"
          echo "current=$CURRENT_BUSYBOX" >> $GITHUB_OUTPUT
          echo "latest=$LATEST_BUSYBOX" >> $GITHUB_OUTPUT

          if [ "$CURRENT_BUSYBOX" != "$LATEST_BUSYBOX" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create security report
        id: report
        run: |
          mkdir -p reports
          cat > reports/security-check-$(date +%Y%m%d).md << EOF
          # Security Update Check - $(date +%Y-%m-%d)

          ## Component Version Check

          ### musl libc
          - Current: ${{ steps.musl_check.outputs.current }}
          - Latest: ${{ steps.musl_check.outputs.latest }}
          - Update needed: ${{ steps.musl_check.outputs.update_needed }}

          ### BusyBox
          - Current: ${{ steps.busybox_check.outputs.current }}
          - Latest: ${{ steps.busybox_check.outputs.latest }}
          - Update needed: ${{ steps.busybox_check.outputs.update_needed }}

          ## Recommended Actions

          EOF

          if [ "${{ steps.musl_check.outputs.update_needed }}" = "true" ]; then
            echo "- [ ] Update musl libc to ${{ steps.musl_check.outputs.latest }}" >> reports/security-check-$(date +%Y%m%d).md
          fi

          if [ "${{ steps.busybox_check.outputs.update_needed }}" = "true" ]; then
            echo "- [ ] Update BusyBox to ${{ steps.busybox_check.outputs.latest }}" >> reports/security-check-$(date +%Y%m%d).md
          fi

      # 公開の Issue にしない。上流の新版は「Kimigayo がまだ古い版で出している」
      # ことを示すので、非公開の Project に足す。同じ版は二度足さない。
      - name: Add security updates to the private Project
        if: steps.musl_check.outputs.update_needed == 'true' || steps.busybox_check.outputs.update_needed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT_ID: ${{ vars.KIMIGAYO_PROJECT_ID }}
          MUSL_UPDATE: ${{ steps.musl_check.outputs.update_needed }}
          MUSL_CURRENT: ${{ steps.musl_check.outputs.current }}
          MUSL_LATEST: ${{ steps.musl_check.outputs.latest }}
          BUSYBOX_UPDATE: ${{ steps.busybox_check.outputs.update_needed }}
          BUSYBOX_CURRENT: ${{ steps.busybox_check.outputs.current }}
          BUSYBOX_LATEST: ${{ steps.busybox_check.outputs.latest }}
        with:
          github-token: ${{ secrets.KIMIGAYO_PROJECT_TOKEN }}
          script: |
            const project = require('./.github/scripts/project-draft.js');
            const id = process.env.PROJECT_ID;
            const state = await project.load(github, id);
            const e = process.env;
            const updates = [
              ['musl', e.MUSL_UPDATE, e.MUSL_CURRENT, e.MUSL_LATEST],
              ['BusyBox', e.BUSYBOX_UPDATE, e.BUSYBOX_CURRENT, e.BUSYBOX_LATEST],
            ].filter(u => u[1] === 'true');
            for (const [name, , current, latest] of updates) {
              const key = `version:${name}:${latest}`;
              if (state.seen.has(key)) { core.info(`${key} は Project にある`); continue; }
              await project.add(github, id, state, {
                title: `⬆️ ${name} の新しい版 ${latest}（いまは ${current}）`,
                body: [
                  `上流に ${name} ${latest} が出た。Kimigayo の公開イメージは ${current}。`,
                  '',
                  '- 上流の NEWS / Changelog でセキュリティ修正を含むかを見る',
                  '- 版上げは version-bump skill。区分は SPECIFICATION.md 10.2',
                  '',
                  `<!-- key:${key} -->`,
                ].join('\n'),
                priority: 'Middle',
              });
              core.info(`added ${key}`);
            }

      - name: Upload security report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report-${{ github.run_number }}
          path: reports/
          retention-days: 90

  # 上流のセキュリティ情報（Debian の security-tracker・Alpine aports・CISA KEV）と
  # Kimigayo の差分を毎日見る（scripts/watch-upstream-fixes.py）。
  # 仕分け済みの一覧（docs/security/upstream-triage.tsv）に無いもの・修正待ちに
  # 修正が出たもの・実際に悪用されているものが出たら、まだ Project に無いものだけ
  # 非公開の Project にまとめて Discord に知らせる。判定できないときは失敗させて Discord に
  # 送る（黙って「差分なし」と読むと、差分が出ても気づけない）。
  upstream-fix-watch:
    name: Watch upstream security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare upstream security data with Kimigayo
        run: |
          set -euo pipefail
          # 公開リポジトリの実行ログとサマリーは誰でも読める。中身は Project にだけ
          # 書き、ここには件数だけを出す。
          python3 -I scripts/watch-upstream-fixes.py --json findings.json > watch-report.md
          n="$(python3 -c 'import json; print(len(json.load(open("findings.json"))))')"
          echo "上流との差分: ${n} 件（中身は非公開の Project）" | tee -a "$GITHUB_STEP_SUMMARY"

      # 公開の Issue にしない。まだ仕分けていない差分は「Kimigayo に当たるかも
      # しれない未対応のもの」なので、非公開の Project に足す
      # （CLAUDE.md「危険度の高いものは Issue にしない」節）。
      # 同じ項目で毎日足さないよう、Project の下書きの本文に埋めた
      # <!-- key:... --> と突き合わせ、まだ無いものだけを足す。
      - name: Add new findings to the private Project
        id: project
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT_ID: ${{ vars.KIMIGAYO_PROJECT_ID }}
        with:
          github-token: ${{ secrets.KIMIGAYO_PROJECT_TOKEN }}
          script: |
            const fs = require('fs');
            const project = require('./.github/scripts/project-draft.js');
            const findings = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
            // 差分が無い日も Project を読む。トークンの期限切れや設定漏れに、
            // 差分が出た日ではなく毎日気づけるようにする（失敗は Discord に届く）。
            const id = process.env.PROJECT_ID;
            const state = await project.load(github, id);
            if (findings.length === 0) { core.info('no findings'); return; }
            const fresh = findings.filter(f => !state.seen.has(`${f.kind}:${f.key}`));
            if (fresh.length === 0) { core.info('all findings are already in the Project'); return; }
            const urgent = fresh.some(f => f.kind === 'exploited');
            const date = new Date().toISOString().split('T')[0];
            const title = `${urgent ? '🚨' : '🔒'} 上流との差分: ${fresh.length} 件（${date}）`;
            const body = [
              '上流のセキュリティ情報（Debian security-tracker・Alpine aports・CISA KEV）と Kimigayo の差分です。',
              '',
              ...fresh.map(f => `- [${f.kind}] ${f.text} <!-- key:${f.kind}:${f.key} -->`),
              '',
              '仕分けて `docs/security/upstream-triage.tsv` に足すと、次から出なくなります（手順は `security-review` skill）。',
            ].join('\n');
            await project.add(github, id, state, { title, body, priority: urgent ? 'High' : 'Middle' });
            core.setOutput('url', state.url);
            core.setOutput('title', title);
            core.setOutput('urgent', urgent ? 'true' : 'false');

      - name: Notify Discord (new findings)
        if: steps.project.outputs.url != '' && env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ steps.project.outputs.urgent == 'true' && 'failure' || 'success' }}
          title: ${{ steps.project.outputs.title }}
          description: |
            上流のセキュリティ情報と Kimigayo の差分が見つかりました（非公開の Project に追加）。
            ${{ steps.project.outputs.url }}
          username: 'Kimigayo Security Bot'

      # 監視そのものが壊れたら（ページの形が変わった・取得に失敗）知らせる。
      - name: Notify Discord (watch failed)
        if: failure() && env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: failure
          title: '❌ 上流のセキュリティ情報の監視が失敗した'
          description: |
            scripts/watch-upstream-fixes.py が判定できませんでした。
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: 'Kimigayo Security Bot'

  trivy-filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # version-check に依存しない。以前は needs を付けて待っていた。

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,config,secret'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

  # trivy-image-scan は削除した（2026-10-09）。理由が3つある。
  #
  # 1. 一度も走ったことがない。if が自己矛盾していた:
  #      github.event.schedule == '0 2 * * *' && ... &&
  #      (github.event.schedule == '0 2 * * 0' || ...)
  #    schedule が同時に毎日と日曜であることはあり得ない。
  # 2. 走っても意味がない。Kimigayo は scratch 上の手組み rootfs で
  #    パッケージデータベースを持たないため、Trivy は対象を1つも
  #    識別できない（実測で Target: - / Not scanned /
  #    Metadata.OS: null / Results: 0）。「脆弱性 0 件」ではなく
  #    「スキャンしていない」。
  # 3. pull 先が存在しない。standard のとき :latest を指していたが、
  #    当時の release.yml は latest-standard までしか作っていなかった
  #    （いまは :latest も作る）。
  #    しかも失敗を || echo で握り潰していた。
  #
  # 構成要素の脆弱性は、出荷物から SBOM を作って照合する scripts/scan-image.sh で
  # 見る（CI・リリース前・毎週の公開 latest）。ここでは版の新旧だけを見る
  # （version-check ジョブ）。
  # → .claude/skills/security-review/SKILL.md
