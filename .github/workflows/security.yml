name: Security

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_HUB_USERNAME: ishinokazuki
  IMAGE_NAME: kimigayo-os

jobs:
  version-check:
    name: Check Component Versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      musl_update: ${{ steps.musl_check.outputs.update_needed }}
      busybox_update: ${{ steps.busybox_check.outputs.update_needed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check Alpine Linux security advisories
        id: alpine_check
        run: |
          # Fetch Alpine security database
          # ビルドに使っている Alpine の版を見る。
          # 以前は edge を見ていたため、実際に使っている 3.24 と
          # 違うデータベースで判断していた。
          # shellcheck disable=SC1091
          source scripts/lib/versions.sh
          url="https://secdb.alpinelinux.org/v${ALPINE_VERSION}/main.json"
          echo "fetching ${url}"
          wget -q "$url" -O alpine-security.json || echo "Failed to fetch ${url}"

          if [ -f alpine-security.json ]; then
            VULN_COUNT=$(jq 'length' alpine-security.json 2>/dev/null || echo "0")
            echo "vulnerabilities=$VULN_COUNT" >> $GITHUB_OUTPUT
            echo "Found $VULN_COUNT packages with known vulnerabilities"
          else
            echo "vulnerabilities=0" >> $GITHUB_OUTPUT
          fi

      - name: Check musl libc updates
        id: musl_check
        run: |
          # 現在のバージョンは versions.mk（単一の真実の源）から読む。
          # 以前は scripts/build-rootfs.sh を grep していたが、そこに
          # MUSL_VERSION= は存在せず常に空だったため、毎日「更新が必要」と
          # 報告し続けていた。
          # shellcheck disable=SC1091
          source scripts/lib/versions.sh
          CURRENT_MUSL="$MUSL_VERSION"
          LATEST_MUSL=$(curl -sL https://musl.libc.org/releases.html \
            | grep -oP 'musl-\K[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || echo "$CURRENT_MUSL")
          [ -n "$LATEST_MUSL" ] || LATEST_MUSL="$CURRENT_MUSL"

          echo "Current musl: $CURRENT_MUSL, Latest: $LATEST_MUSL"
          echo "current=$CURRENT_MUSL" >> $GITHUB_OUTPUT
          echo "latest=$LATEST_MUSL" >> $GITHUB_OUTPUT

          if [ "$CURRENT_MUSL" != "$LATEST_MUSL" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check BusyBox updates
        id: busybox_check
        run: |
          # shellcheck disable=SC1091
          source scripts/lib/versions.sh
          CURRENT_BUSYBOX="$BUSYBOX_VERSION"
          LATEST_BUSYBOX=$(curl -sL https://busybox.net/downloads/ | grep -oP 'busybox-\K[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || echo "$CURRENT_BUSYBOX")
          [ -n "$LATEST_BUSYBOX" ] || LATEST_BUSYBOX="$CURRENT_BUSYBOX"

          echo "Current BusyBox: $CURRENT_BUSYBOX, Latest: $LATEST_BUSYBOX"
          echo "current=$CURRENT_BUSYBOX" >> $GITHUB_OUTPUT
          echo "latest=$LATEST_BUSYBOX" >> $GITHUB_OUTPUT

          if [ "$CURRENT_BUSYBOX" != "$LATEST_BUSYBOX" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create security report
        id: report
        run: |
          mkdir -p reports
          cat > reports/security-check-$(date +%Y%m%d).md << EOF
          # Security Update Check - $(date +%Y-%m-%d)

          ## Component Version Check

          ### musl libc
          - Current: ${{ steps.musl_check.outputs.current }}
          - Latest: ${{ steps.musl_check.outputs.latest }}
          - Update needed: ${{ steps.musl_check.outputs.update_needed }}

          ### BusyBox
          - Current: ${{ steps.busybox_check.outputs.current }}
          - Latest: ${{ steps.busybox_check.outputs.latest }}
          - Update needed: ${{ steps.busybox_check.outputs.update_needed }}

          ### Alpine Linux Security Advisories
          - Vulnerabilities found: ${{ steps.alpine_check.outputs.vulnerabilities }}

          ## Recommended Actions

          EOF

          if [ "${{ steps.musl_check.outputs.update_needed }}" = "true" ]; then
            echo "- [ ] Update musl libc to ${{ steps.musl_check.outputs.latest }}" >> reports/security-check-$(date +%Y%m%d).md
          fi

          if [ "${{ steps.busybox_check.outputs.update_needed }}" = "true" ]; then
            echo "- [ ] Update BusyBox to ${{ steps.busybox_check.outputs.latest }}" >> reports/security-check-$(date +%Y%m%d).md
          fi

          if [ "${{ steps.alpine_check.outputs.vulnerabilities }}" != "0" ]; then
            echo "- [ ] Review Alpine security advisories" >> reports/security-check-$(date +%Y%m%d).md
          fi

      - name: Create issue for security updates
        if: steps.musl_check.outputs.update_needed == 'true' || steps.busybox_check.outputs.update_needed == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const reportPath = `reports/security-check-${new Date().toISOString().split('T')[0].replace(/-/g, '')}.md`;
            const reportContent = fs.readFileSync(reportPath, 'utf8');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.startsWith('🔒 Security Update Available')
            );

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## Update - ${new Date().toISOString().split('T')[0]}\n\n${reportContent}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔒 Security Update Available - ${new Date().toISOString().split('T')[0]}`,
                body: reportContent,
                labels: ['security', 'automated', 'dependencies']
              });
            }

      - name: Upload security report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: security-report-${{ github.run_number }}
          path: reports/
          retention-days: 90

  trivy-filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # version-check に依存しない。以前は needs を付けて待っていた。

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,config,secret'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

  # trivy-image-scan は削除した（2026-10-09）。理由が3つある。
  #
  # 1. 一度も走ったことがない。if が自己矛盾していた:
  #      github.event.schedule == '0 2 * * *' && ... &&
  #      (github.event.schedule == '0 2 * * 0' || ...)
  #    schedule が同時に毎日と日曜であることはあり得ない。
  # 2. 走っても意味がない。Kimigayo は scratch 上の手組み rootfs で
  #    パッケージデータベースを持たないため、Trivy は対象を1つも
  #    識別できない（実測で Target: - / Not scanned /
  #    Metadata.OS: null / Results: 0）。「脆弱性 0 件」ではなく
  #    「スキャンしていない」。
  # 3. pull 先が存在しない。standard のとき :latest を指していたが、
  #    release.yml は latest-standard までしか作らない。
  #    しかも失敗を || echo で握り潰していた。
  #
  # 構成要素の脆弱性は版を手で突合して追う（version-check ジョブ）。
  # 構造的な対策は SBOM の生成（未着手、要判断）。
  # → .claude/skills/security-review/SKILL.md
