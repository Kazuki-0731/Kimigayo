name: Security

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_HUB_USERNAME: ishinokazuki
  IMAGE_NAME: kimigayo-os

jobs:
  version-check:
    name: Check Component Versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      musl_update: ${{ steps.musl_check.outputs.update_needed }}
      busybox_update: ${{ steps.busybox_check.outputs.update_needed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Alpine の secdb を数えるステップは削除した（2026-10-12）。
      # jq 'length' はトップレベルのキー数（常に 6）を数えていただけで、
      # しかも Alpine のパッケージは出荷物に入らない（Alpine はビルド環境）。
      # 出荷物の CVE は scripts/scan-image.sh が見る（ci.yml・release.yml・
      # dependency-review.yml の published-image-scan）。

      - name: Check musl libc updates
        id: musl_check
        run: |
          # 現在のバージョンは versions.mk（単一の真実の源）から読む。
          # 以前は scripts/build-rootfs.sh を grep していたが、そこに
          # MUSL_VERSION= は存在せず常に空だったため、毎日「更新が必要」と
          # 報告し続けていた。
          # shellcheck disable=SC1091
          source scripts/lib/versions.sh
          CURRENT_MUSL="$MUSL_VERSION"
          LATEST_MUSL=$(curl -sL https://musl.libc.org/releases.html \
            | grep -oP 'musl-\K[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || echo "$CURRENT_MUSL")
          [ -n "$LATEST_MUSL" ] || LATEST_MUSL="$CURRENT_MUSL"

          echo "Current musl: $CURRENT_MUSL, Latest: $LATEST_MUSL"
          echo "current=$CURRENT_MUSL" >> $GITHUB_OUTPUT
          echo "latest=$LATEST_MUSL" >> $GITHUB_OUTPUT

          if [ "$CURRENT_MUSL" != "$LATEST_MUSL" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check BusyBox updates
        id: busybox_check
        run: |
          # shellcheck disable=SC1091
          source scripts/lib/versions.sh
          CURRENT_BUSYBOX="$BUSYBOX_VERSION"
          LATEST_BUSYBOX=$(curl -sL https://busybox.net/downloads/ | grep -oP 'busybox-\K[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || echo "$CURRENT_BUSYBOX")
          [ -n "$LATEST_BUSYBOX" ] || LATEST_BUSYBOX="$CURRENT_BUSYBOX"

          echo "Current BusyBox: $CURRENT_BUSYBOX, Latest: $LATEST_BUSYBOX"
          echo "current=$CURRENT_BUSYBOX" >> $GITHUB_OUTPUT
          echo "latest=$LATEST_BUSYBOX" >> $GITHUB_OUTPUT

          if [ "$CURRENT_BUSYBOX" != "$LATEST_BUSYBOX" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create security report
        id: report
        run: |
          mkdir -p reports
          cat > reports/security-check-$(date +%Y%m%d).md << EOF
          # Security Update Check - $(date +%Y-%m-%d)

          ## Component Version Check

          ### musl libc
          - Current: ${{ steps.musl_check.outputs.current }}
          - Latest: ${{ steps.musl_check.outputs.latest }}
          - Update needed: ${{ steps.musl_check.outputs.update_needed }}

          ### BusyBox
          - Current: ${{ steps.busybox_check.outputs.current }}
          - Latest: ${{ steps.busybox_check.outputs.latest }}
          - Update needed: ${{ steps.busybox_check.outputs.update_needed }}

          ## Recommended Actions

          EOF

          if [ "${{ steps.musl_check.outputs.update_needed }}" = "true" ]; then
            echo "- [ ] Update musl libc to ${{ steps.musl_check.outputs.latest }}" >> reports/security-check-$(date +%Y%m%d).md
          fi

          if [ "${{ steps.busybox_check.outputs.update_needed }}" = "true" ]; then
            echo "- [ ] Update BusyBox to ${{ steps.busybox_check.outputs.latest }}" >> reports/security-check-$(date +%Y%m%d).md
          fi

      - name: Create issue for security updates
        if: steps.musl_check.outputs.update_needed == 'true' || steps.busybox_check.outputs.update_needed == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const reportPath = `reports/security-check-${new Date().toISOString().split('T')[0].replace(/-/g, '')}.md`;
            const reportContent = fs.readFileSync(reportPath, 'utf8');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.startsWith('🔒 Security Update Available')
            );

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## Update - ${new Date().toISOString().split('T')[0]}\n\n${reportContent}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔒 Security Update Available - ${new Date().toISOString().split('T')[0]}`,
                body: reportContent,
                labels: ['security', 'automated', 'dependencies']
              });
            }

      - name: Upload security report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: security-report-${{ github.run_number }}
          path: reports/
          retention-days: 90

  # 上流のセキュリティ情報（Debian の security-tracker・Alpine aports・CISA KEV）と
  # Kimigayo の差分を毎日見る（scripts/watch-upstream-fixes.py）。
  # 仕分け済みの一覧（docs/security/upstream-triage.tsv）に無いもの・修正待ちに
  # 修正が出たもの・実際に悪用されているものが出たら、まだ Issue に無いものだけ
  # Issue にまとめて Discord に知らせる。判定できないときは失敗させて Discord に
  # 送る（黙って「差分なし」と読むと、差分が出ても気づけない）。
  upstream-fix-watch:
    name: Watch upstream security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare upstream security data with Kimigayo
        run: |
          set -euo pipefail
          python3 -I scripts/watch-upstream-fixes.py --json findings.json | tee watch-report.md
          { echo '## 上流との差分'; cat watch-report.md; } >> "$GITHUB_STEP_SUMMARY"

      # 同じ項目で毎日 Issue と通知を出さないよう、開いている Issue の本文に
      # 埋めた <!-- key:... --> と突き合わせ、まだ無いものだけを出す。
      - name: Open an issue for new findings
        id: issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const findings = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
            if (findings.length === 0) { core.info('no findings'); return; }
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'security,automated', state: 'open', per_page: 100
            });
            const seen = new Set();
            for (const i of open) {
              for (const m of (i.body || '').matchAll(/<!-- key:(\S+) -->/g)) seen.add(m[1]);
            }
            const fresh = findings.filter(f => !seen.has(`${f.kind}:${f.key}`));
            if (fresh.length === 0) { core.info('all findings already have issues'); return; }
            const urgent = fresh.some(f => f.kind === 'exploited');
            const date = new Date().toISOString().split('T')[0];
            const title = `${urgent ? '🚨' : '🔒'} 上流との差分: ${fresh.length} 件（${date}）`;
            const body = [
              '上流のセキュリティ情報（Debian security-tracker・Alpine aports・CISA KEV）と Kimigayo の差分です。',
              '',
              ...fresh.map(f => `- [${f.kind}] ${f.text} <!-- key:${f.kind}:${f.key} -->`),
              '',
              '仕分けて `docs/security/upstream-triage.tsv` に足すと、次から出なくなります（手順は `security-review` skill）。',
            ].join('\n');
            const created = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['security', 'automated']
            });
            core.setOutput('url', created.data.html_url);
            core.setOutput('title', title);
            core.setOutput('urgent', urgent ? 'true' : 'false');

      - name: Notify Discord (new findings)
        if: steps.issue.outputs.url != '' && env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ steps.issue.outputs.urgent == 'true' && 'failure' || 'success' }}
          title: ${{ steps.issue.outputs.title }}
          description: |
            上流のセキュリティ情報と Kimigayo の差分が見つかりました。
            ${{ steps.issue.outputs.url }}
          username: 'Kimigayo Security Bot'

      # 監視そのものが壊れたら（ページの形が変わった・取得に失敗）知らせる。
      - name: Notify Discord (watch failed)
        if: failure() && env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: failure
          title: '❌ 上流のセキュリティ情報の監視が失敗した'
          description: |
            scripts/watch-upstream-fixes.py が判定できませんでした。
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: 'Kimigayo Security Bot'

  trivy-filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # version-check に依存しない。以前は needs を付けて待っていた。

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,config,secret'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

  # trivy-image-scan は削除した（2026-10-09）。理由が3つある。
  #
  # 1. 一度も走ったことがない。if が自己矛盾していた:
  #      github.event.schedule == '0 2 * * *' && ... &&
  #      (github.event.schedule == '0 2 * * 0' || ...)
  #    schedule が同時に毎日と日曜であることはあり得ない。
  # 2. 走っても意味がない。Kimigayo は scratch 上の手組み rootfs で
  #    パッケージデータベースを持たないため、Trivy は対象を1つも
  #    識別できない（実測で Target: - / Not scanned /
  #    Metadata.OS: null / Results: 0）。「脆弱性 0 件」ではなく
  #    「スキャンしていない」。
  # 3. pull 先が存在しない。standard のとき :latest を指していたが、
  #    当時の release.yml は latest-standard までしか作っていなかった
  #    （いまは :latest も作る）。
  #    しかも失敗を || echo で握り潰していた。
  #
  # 構成要素の脆弱性は、出荷物から SBOM を作って照合する scripts/scan-image.sh で
  # 見る（CI・リリース前・毎週の公開 latest）。ここでは版の新旧だけを見る
  # （version-check ジョブ）。
  # → .claude/skills/security-review/SKILL.md
