name: Reusable Build Workflow

# ビルドして、イメージにして、**実際に実行して検証する**。
#
# 2026-10-09 まで、このワークフローは rootfs を作るところで止まっていた。
# イメージ化も実行もしていなかったため、次の壊れ方をすべて見逃していた。
#
#   - OpenRC のバイナリが1つも入っていない（v0.1.0〜v2.0.1 の全タグ）
#   - musl の libc.so が無く動的リンカがリンク切れ
#   - /tmp・/run が無い（サイズ最適化が空ディレクトリを消していた）
#   - arm64 の libc.so が出荷しない libgcc_s.so.1 に依存していて、
#     動的リンクのバイナリが全滅（6ジョブすべて緑のまま）
#
# 検証の実体は scripts/verify-image.sh。**ここに検証ロジックを書かない。**
# CI・release・ローカル（make verify-image）が同じものを呼ぶ必要がある。
# YAML に書くと経路ごとにずれて、同じ見逃しが起きる。

on:
  workflow_call:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        type: string
        default: 'minimal'
      arch:
        description: 'Target architecture'
        required: true
        type: string
        default: 'x86_64'
      build_kernel:
        description: >-
          カーネルもビルドする。Docker イメージにカーネルは入らないので、
          既定では飛ばす（1 run あたり数十分の差）。
          src/kernel/ や KERNEL_VERSION を触ったときだけ true にする。
        required: false
        type: boolean
        default: false
      upload_artifacts:
        description: 'Upload the rootfs tarball as a build artifact'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.variant }} ${{ inputs.arch }}${{ inputs.build_kernel && ' (+kernel)' || '' }}
    runs-on: ubuntu-latest
    # 実測の最長は arm64 の 59 分（manual-build.yml を build_kernel=true で
    # 回したとき、c851a25、2026-10-12）。カーネル抜きの CI はこれより大幅に短い。
    # 既定の 360 分だとハングしたときに 6 時間占有する。
    # timeout-minutes に式を書くのは対応が怪しいので定数にしてある。
    timeout-minutes: 120

    # verify-image ジョブは別ランナーで docker build をやり直す
    # （rootfs は artifact 経由）。**版を両方のジョブで同じ値にする**ため、
    # ここで決めて出力する。片方だけ渡すと /etc/os-release と LABEL が
    # 食い違い、verify-image.sh の突合で落ちる。
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # get-version.sh は `git describe --tags` を使う。
          # 既定の浅いクローンではタグが無く 0.0.0-<sha> になる。
          fetch-depth: 0

      - name: Resolve project version
        id: ver
        run: |
          set -euo pipefail
          v="$(bash scripts/get-version.sh)"
          cn="$(bash scripts/get-codename.sh "$v" || true)"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "::notice::version=${v}${cn:+ \"${cn}\"}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # --no-cache は付けない。ビルド環境イメージは 1.46GB あり、
      # 毎ジョブ作り直すと matrix のぶんだけ無駄になる。
      # 中身が変わったかは Dockerfile のハッシュで Docker が判断する。
      - name: Build build-environment image
        run: docker compose build
        env:
          # Dockerfile の LABEL version 用。公開しないイメージだが、
          # 既定値のまま出すと「どの版で作った環境か」が追えない。
          KIMIGAYO_VERSION: ${{ steps.ver.outputs.version }}

      - name: Build Kimigayo OS
        run: |
          set -euo pipefail
          target=$([ "${{ inputs.build_kernel }}" = "true" ] && echo build || echo build-no-kernel)
          echo "::notice::make ${target} TARGET_ARCH=${{ inputs.arch }} IMAGE_TYPE=${{ inputs.variant }}"
          docker compose run --rm \
            -e IMAGE_TYPE=${{ inputs.variant }} \
            -e KIMIGAYO_VERSION=${{ steps.ver.outputs.version }} \
            kimigayo-build \
            make "${target}" TARGET_ARCH=${{ inputs.arch }} IMAGE_TYPE=${{ inputs.variant }}

      # カーネルのパッチは当たらなくても apply-kernel-patches.sh が log_warn して
      # return 0 する（BusyBox・musl の適用スクリプトは当たらなければ exit 1 で止まる）。
      # 黙ってスキップされたまま成功扱いになるのを止める。
      - name: Fail if patches were silently skipped
        run: |
          set -uo pipefail
          found=0
          for log in build/kernel-patches.log build/busybox-patches.log; do
            [ -f "$log" ] || continue
            if grep -iE 'skipped: [1-9]|not applicable' "$log"; then
              echo "::error::${log} にスキップされたパッチがあります"
              found=1
            fi
          done
          exit "$found"

      # カーネルを作ったときは、実際の .config の強化項目を残す。
      # src/kernel/config/ はほとんど使われず、上流 defconfig に
      # apply_security_hardening を当てたものがビルドされるので、
      # 「何が有効か」は成果物の .config でしか分からない。
      - name: Record kernel config (build_kernel only)
        if: ${{ inputs.build_kernel }}
        run: |
          set -euo pipefail
          cfg=$(ls build/kernel/output/config-* | head -1)
          {
            echo "### Kernel config: $(basename "$cfg")"
            echo '```'
            grep -E '^(# )?CONFIG_(SECURITY|SECURITY_DMESG_RESTRICT|HARDENED_USERCOPY|FORTIFY_SOURCE|STACKPROTECTOR|STACKPROTECTOR_STRONG|RANDOMIZE_BASE|RANDOMIZE_MEMORY|MITIGATION_RETPOLINE|MITIGATION_PAGE_TABLE_ISOLATION|SECURITY_YAMA|USER_NS|OVERLAY_FS|SQUASHFS|NETFILTER|NETFILTER_XTABLES|IP_NF_IPTABLES|SECCOMP|SECCOMP_FILTER|MODULES|STRICT_KERNEL_RWX|INIT_ON_ALLOC_DEFAULT_ON)[ =]' "$cfg" | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel config (build_kernel only)
        if: ${{ inputs.build_kernel }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-config-${{ inputs.arch }}
          path: build/kernel/output/config-*
          retention-days: 30

      - name: Package rootfs
        run: |
          set -euo pipefail
          mkdir -p output
          # root 権限で固める。/etc/shadow のような権限制限ファイルを
          # 読むため。--numeric-owner はホストのユーザー名を埋め込まないため。
          # 並び順・mtime（コミット時刻）・gzip のヘッダを固定し、同じコミット
          # からは同じバイト列の tarball になるようにする（再現可能ビルド）。
          epoch="$(git log -1 --format=%ct)"
          sudo tar -C build/rootfs --sort=name --mtime="@${epoch}" \
            --owner=0 --group=0 --numeric-owner -cf - . \
            | gzip -n > "output/kimigayo-${{ inputs.variant }}-${{ inputs.arch }}.tar.gz"
          sudo chown "$(id -u):$(id -g)" "output/kimigayo-${{ inputs.variant }}-${{ inputs.arch }}.tar.gz"
          ls -lh output/

      # 検証ジョブは別アーキのランナーで走るので、必ず受け渡す。
      # upload_artifacts とは別（あちらは利用者向けの成果物）。
      - name: Upload rootfs tarball for verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootfs-${{ inputs.variant }}-${{ inputs.arch }}
          path: output/kimigayo-${{ inputs.variant }}-${{ inputs.arch }}.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload build artifacts
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kimigayo-os-${{ inputs.variant }}-${{ inputs.arch }}
          path: output/*
          retention-days: 7

      # musl-build.log だけで 6.4MB になるので、失敗時だけ上げる。
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ inputs.variant }}-${{ inputs.arch }}
          path: |
            build/logs/*.log
            build/*-patches.log
          retention-days: 7
          if-no-files-found: ignore

  verify-image:
    name: Verify image ${{ inputs.variant }} ${{ inputs.arch }}
    needs: build
    # arm64 はネイティブランナーで実行する。QEMU を介さないので速く、
    # 本物の aarch64 で動くため検証の信頼性が最も高い。
    # ビルド自体は x86 からのクロスコンパイル（build ジョブ）のまま。
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download rootfs tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rootfs-${{ inputs.variant }}-${{ inputs.arch }}
          path: output/

      - name: Build Docker image
        run: |
          set -euo pipefail
          # --platform と TARBALL_PATH は必須。
          # 省略すると arm64 の rootfs を amd64 のイメージとして包み、
          # 既定の TARBALL_PATH=output/*.tar.gz が別の tarball を拾う。
          platform=$([ "${{ inputs.arch }}" = "arm64" ] && echo linux/arm64 || echo linux/amd64)
          # VERSION / IMAGE_VARIANT を渡さないと LABEL が既定値のまま出る。
          # **渡し忘れても docker build は成功する**ので、タグ名だけ合って
          # 中身のメタデータがずれる。2026-10-10 まで CI が作るイメージは
          # すべて `io.kimigayo.variant=minimal` / `version=dev` だった。
          # VERSION は build ジョブと同じ値を使う（os-release と突合される）。
          docker build \
            --platform "$platform" \
            -f Dockerfile.runtime \
            --build-arg TARBALL_PATH="output/kimigayo-${{ inputs.variant }}-${{ inputs.arch }}.tar.gz" \
            --build-arg VERSION="${{ needs.build.outputs.version }}" \
            --build-arg IMAGE_VARIANT="${{ inputs.variant }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VCS_REF="${{ github.sha }}" \
            -t "kimigayo-os:${{ inputs.variant }}-${{ inputs.arch }}" \
            .
          docker images "kimigayo-os:${{ inputs.variant }}-${{ inputs.arch }}" \
            --format 'image size: {{.Size}}'

      # ここが本題。検証の実体はスクリプト側にある（→ 冒頭のコメント）。
      - name: Verify image by running it
        run: |
          bash scripts/verify-image.sh \
            "kimigayo-os:${{ inputs.variant }}-${{ inputs.arch }}" \
            "${{ inputs.variant }}" \
            "${{ inputs.arch }}"

      # 出荷物そのものの秘密情報スキャンと CVE 照合（scripts/scan-image.sh）。
      # 秘密情報と CVE の両方を見る。CVE は出荷物の版で SBOM を作って
      # Grype で照合し、イメージに記録したパッチ済みの CVE は除外する。
      # NVD に新しい CVE が載ると、コードを変えていない push でも落ちる。
      # それは「出荷物に未対応の CVE がある」という正しい信号なので握り潰さない。
      - name: Scan image for secrets and CVEs
        run: |
          SBOM_OUT="build/sbom/kimigayo-${{ inputs.variant }}-${{ inputs.arch }}.cdx.json" \
            bash scripts/scan-image.sh \
            "kimigayo-os:${{ inputs.variant }}-${{ inputs.arch }}" \
            "${{ inputs.variant }}" \
            "${{ inputs.arch }}"

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.variant }}-${{ inputs.arch }}
          path: build/sbom/*.cdx.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report image size
        if: success()
        run: |
          size=$(docker images "kimigayo-os:${{ inputs.variant }}-${{ inputs.arch }}" --format '{{.Size}}')
          echo "::notice::${{ inputs.variant }} ${{ inputs.arch }} image size: ${size}"
          {
            echo "### ${{ inputs.variant }} / ${{ inputs.arch }}"
            echo ""
            echo "- image size: \`${size}\`"
            echo "- verified on: \`$(uname -m)\` runner"
          } >> "$GITHUB_STEP_SUMMARY"
