name: Release

# タグを push すると Docker Hub の公開イメージを差し替える。
#
# 2026-10-09 に構造から書き換えた。それまでの問題:
#
#   - スモークテストが tarball < 1MB なら exit 0 で成功扱いになっていた。
#     壊れた rootfs ほど小さくなるので、最も危険なときに検査が消える
#   - スモークテストしたイメージと push するイメージが別物だった
#     （スモークは --platform も TARBALL_PATH も渡さない docker build、
#       push は build-push-action の別ビルド）
#   - スモークの中身が /bin/sh・ls・busybox --help の3つだけ。当時の BusyBox は
#     static-pie だったので、OpenRC も libc.so も /tmp も無くても全部通る
#   - ビルド経路が ci.yml と違っていた（CI は make、ここは
#     build-rootfs.sh 直叩き）。CI が緑でも release が通る保証がない
#   - matrix に fail-fast: false が無く、1セル失敗で他がキャンセルされる。
#     push 済みのタグは残るのに create-manifest はスキップされ、
#     マニフェストの無い中途半端な公開状態になる
#   - ShellCheck と Trivy に continue-on-error が付いていた
#   - Trivy のイメージスキャンを走らせていたが、Kimigayo は scratch 上の
#     手組み rootfs でパッケージDBを持たないため常に0件。
#     「脆弱性なし」ではなく「スキャンしていない」
#
# いまの方針:
#   build（x86 でクロスコンパイル）→ verify-and-push（ネイティブ
#   ランナーでイメージ化・検証・push）。**検証したそのイメージを push する。**
#   検証の実体は scripts/verify-image.sh で、ci.yml とローカルも同じものを呼ぶ。
#
# **公開するのは v*.*.* タグの push だけ。** 手動実行（workflow_dispatch）は
# ビルドと検証（verify-image.sh・scan-image.sh）までで、Docker Hub には
# 一切 push しない。マニフェスト・署名・GitHub Release も作らない。
# 2026-10-12 までは手動実行でも verify-and-push が push しており、既定の
# tag 入力のままだと latest-<variant>-<arch> を上書きしていた。しかも
# マニフェスト・署名・Release はタグ push のときしか走らないので、
# 「push されたが署名もマニフェストも無い」状態を作れた。
# 公開をやり直したいときは、タグを打ち直すか Actions の Re-run を使う
# （どちらも github.event_name が push のまま）。

on:
  push:
    tags:
      - 'v*.*.*'
  # 手動実行はビルドと検証だけ（push しない。→ 冒頭のコメント）。
  workflow_dispatch:
    inputs:
      tag:
        description: 'イメージに入れる版の表記（例: v3.1.0）。空なら edge。Docker Hub には push しない'
        required: false
        default: ''

env:
  DOCKER_HUB_USERNAME: ishinokazuki
  IMAGE_NAME: kimigayo-os
  # 公開する run かどうか。タグの push のときだけ 'true'。
  # ステップの if はここを見る（ジョブの if では env を参照できないので、
  # create-manifest / sign / create-github-release は同じ条件を直接書いている）。
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Extract version
        id: v
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION=edge
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::version=${VERSION}"

  # matrix の各セルで回す必要がない。以前は6回走っていた。
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # continue-on-error は付けない。静的解析がリリースを止められない
      # のでは意味がない。
      #
      # ci.yml と同じく make shellcheck-scan と同じ対象を、ダイジェストで
      # 固定したイメージで検査する。以前の ludeeus/action-shellcheck は
      # additional_files を ./scripts の中での find -name として扱うため、
      # .claude/hooks/ を検査していなかった。
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            --severity=warning \
            scripts/*.sh scripts/lib/*.sh .claude/hooks/*.sh

  # BusyBox（GPL-2.0-only）をバイナリで配るので、対応するソースを
  # Release に添付する（v3.0.2 以前は付いていなかった）。上流の tarball と
  # パッチ・config・ビルドスクリプトを含むリポジトリの archive。
  # 手動実行でも走らせて、タグを打つ前に集められることを確かめる。
  sources:
    name: Collect corresponding source
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect source archives
        env:
          KIMIGAYO_VERSION: ${{ needs.meta.outputs.version }}
        run: bash scripts/collect-sources.sh sources

      - name: Upload source archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: sources/
          retention-days: 30
          if-no-files-found: error

  build:
    name: Build ${{ matrix.variant }} ${{ matrix.arch }}
    needs: [meta, shellcheck]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # 1セル失敗で他をキャンセルしない（→ 冒頭のコメント）。
      fail-fast: false
      matrix:
        variant: [minimal, standard, extended]
        arch: [x86_64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build build-environment image
        run: docker compose build
        env:
          KIMIGAYO_VERSION: ${{ needs.meta.outputs.version }}

      # ci.yml と同じ入口を使う。経路が分かれていると、CI が緑でも
      # release で落ちる（逆も）ことになる。
      # カーネルはイメージに入らないので作らない。
      #
      # **KIMIGAYO_VERSION を渡す。** これが rootfs の /etc/os-release・
      # /etc/motd・/.kimigayo-build-info に入る版になる。渡さないと
      # docker-compose.yml の既定値 `dev` が使われ、**公開イメージが
      # `dev` と名乗る**（2026-10-10 まで 0.1.0 直書きで同じことが
      # 起きていた）。さらに下の docker build が渡す LABEL version とも
      # 食い違い、verify-image.sh の突合で落ちる。
      - name: Build Kimigayo OS rootfs
        run: |
          set -euo pipefail
          docker compose run --rm \
            -e IMAGE_TYPE=${{ matrix.variant }} \
            -e KIMIGAYO_VERSION=${{ needs.meta.outputs.version }} \
            kimigayo-build \
            make build-no-kernel TARGET_ARCH=${{ matrix.arch }} IMAGE_TYPE=${{ matrix.variant }}

      - name: Fail if patches were silently skipped
        run: |
          set -uo pipefail
          found=0
          for log in build/kernel-patches.log build/busybox-patches.log; do
            [ -f "$log" ] || continue
            if grep -iE 'skipped: [1-9]|not applicable' "$log"; then
              echo "::error::${log} にスキップされたパッチがあります"
              found=1
            fi
          done
          exit "$found"

      - name: Package rootfs
        run: |
          set -euo pipefail
          mkdir -p output
          name="kimigayo-${{ matrix.variant }}-${{ needs.meta.outputs.version }}-${{ matrix.arch }}.tar.gz"
          # root 権限で固める（/etc/shadow を読むため）。
          # --numeric-owner でホストのユーザー名を埋め込まない。
          # 並び順・mtime（コミット時刻）・gzip のヘッダを固定する（再現可能ビルド。
          # build-workflow.yml と同じ）
          epoch="$(git log -1 --format=%ct)"
          sudo tar -C build/rootfs --sort=name --mtime="@${epoch}" \
            --owner=0 --group=0 --numeric-owner -cf - . \
            | gzip -n > "output/${name}"
          sudo chown "$(id -u):$(id -g)" "output/${name}"
          ls -lh output/

      - name: Upload rootfs tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kimigayo-${{ matrix.variant }}-${{ needs.meta.outputs.version }}-${{ matrix.arch }}
          path: output/*.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ matrix.variant }}-${{ matrix.arch }}
          path: |
            build/logs/*.log
            build/*-patches.log
          retention-days: 7
          if-no-files-found: ignore

  # 検証は常に行い、push はタグの push のときだけ（env.PUBLISH）。
  verify-and-push:
    name: Verify and push ${{ matrix.variant }} ${{ matrix.arch }}
    # ソースを集められないうちは公開しない（GPL のソース提供が欠ける）
    needs: [meta, build, sources]
    # arm64 はネイティブランナーで検証する。QEMU を介さないので
    # 本物の aarch64 で動くことを確かめられる。
    # ここでやるのは tarball を scratch に包むだけなのでクロスコンパイルは不要。
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, standard, extended]
        arch: [x86_64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download rootfs tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kimigayo-${{ matrix.variant }}-${{ needs.meta.outputs.version }}-${{ matrix.arch }}
          path: output/

      - name: Resolve tags
        id: tags
        run: |
          set -euo pipefail
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            docker_arch=amd64
            platform=linux/amd64
          else
            docker_arch=arm64
            platform=linux/arm64
          fi
          repo="${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          v="${{ needs.meta.outputs.version }}"
          variant="${{ matrix.variant }}"
          {
            echo "docker_arch=${docker_arch}"
            echo "platform=${platform}"
            echo "primary=${repo}:${v}-${variant}-${docker_arch}"
            echo "moving=${repo}:latest-${variant}-${docker_arch}"
          } >> "$GITHUB_OUTPUT"

      # 検証するイメージと push するイメージを同一にする。
      # 別々にビルドすると「テストした物を出していない」ことになる。
      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --platform "${{ steps.tags.outputs.platform }}" \
            -f Dockerfile.runtime \
            --build-arg TARBALL_PATH="output/kimigayo-${{ matrix.variant }}-${{ needs.meta.outputs.version }}-${{ matrix.arch }}.tar.gz" \
            --build-arg VERSION="${{ needs.meta.outputs.version }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VCS_REF="${{ github.sha }}" \
            --build-arg IMAGE_VARIANT="${{ matrix.variant }}" \
            -t "${{ steps.tags.outputs.primary }}" \
            -t "${{ steps.tags.outputs.moving }}" \
            .

      # ここを通らなければ push しない。
      # 以前は tarball が小さいと exit 0 でスキップしていた。
      # EXPECT_VERSION を渡すと、LABEL version / os-release の VERSION_ID が
      # この版と一致しなければ落ちる。リリースで版の渡し忘れを通さないため。
      - name: Verify image by running it
        env:
          EXPECT_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          bash scripts/verify-image.sh \
            "${{ steps.tags.outputs.primary }}" \
            "${{ matrix.variant }}" \
            "${{ matrix.arch }}"

      # 公開するイメージそのものに鍵やトークンが紛れていないか。
      # 秘密情報と CVE。Docker Hub に出たものは取り消せないので、push の前に止める。
      # 作った SBOM は GitHub Release に添付する（利用者が自分の照合器にかけられる）。
      - name: Scan image for secrets and CVEs
        run: |
          SBOM_OUT="sbom/kimigayo-${{ matrix.variant }}-${{ needs.meta.outputs.version }}-${{ matrix.arch }}.cdx.json" \
            bash scripts/scan-image.sh \
            "${{ steps.tags.outputs.primary }}" \
            "${{ matrix.variant }}" \
            "${{ matrix.arch }}"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.variant }}-${{ matrix.arch }}
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push verified image
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          docker push "${{ steps.tags.outputs.primary }}"
          docker push "${{ steps.tags.outputs.moving }}"
          echo "::notice::pushed ${{ steps.tags.outputs.primary }}"

      - name: Report image size
        run: |
          size=$(docker images "${{ steps.tags.outputs.primary }}" --format '{{.Size}}')
          {
            echo "### ${{ matrix.variant }} / ${{ matrix.arch }}"
            echo ""
            echo "- image size: \`${size}\`"
            echo "- verified on: \`$(uname -m)\` runner"
            echo "- tags: \`${{ steps.tags.outputs.primary }}\`, \`${{ steps.tags.outputs.moving }}\`"
            if [ "${PUBLISH}" = "true" ]; then
              echo "- pushed to Docker Hub"
            else
              echo "- **not pushed**（workflow_dispatch はビルドと検証のみ）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  create-manifest:
    name: Create multi-arch manifests
    needs: [meta, verify-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 作るタグ:
      #   <version>-<variant>  版を固定したいとき
      #   latest-<variant>      バリアントを選んで最新を追いたいとき
      #   <version>             standard の別名（バリアント名を書かない形）
      #   latest                standard の最新。docs/user/DOCKER_USAGE.md が
      #                         案内しているので実在させる
      #   latest-<arch>         standard のアーキ別。docs/RELEASE_CHECKLIST.md が
      #                         `docker pull ...:latest-amd64` を案内している
      #
      # standard を既定にするのは、README が「推奨」としているため。
      #
      # **公開済みのタグを1つでも更新し忘れると、古い内容が残り続ける。**
      # latest-amd64 / latest-arm64 は 2025-12-21 から公開されているのに
      # このジョブが作っていなかった。2026-10-09 の事故で 9 タグが v0.1.1 の
      # 内容（OpenRC も libc.so も /tmp も入っていない版）に差し替わった際、
      # このままでは latest-amd64 / latest-arm64 だけ復旧できなかった。
      - name: Create and push multi-arch manifests
        run: |
          set -euo pipefail
          repo="${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          v="${{ needs.meta.outputs.version }}"
          for variant in minimal standard extended; do
            docker buildx imagetools create -t "${repo}:${v}-${variant}" \
              "${repo}:${v}-${variant}-amd64" \
              "${repo}:${v}-${variant}-arm64"
            docker buildx imagetools create -t "${repo}:latest-${variant}" \
              "${repo}:latest-${variant}-amd64" \
              "${repo}:latest-${variant}-arm64"
            echo "::notice::manifest ${repo}:${v}-${variant}"
          done

          # バリアント名を書かない形は standard を指す
          docker buildx imagetools create -t "${repo}:${v}" \
            "${repo}:${v}-standard-amd64" "${repo}:${v}-standard-arm64"
          docker buildx imagetools create -t "${repo}:latest" \
            "${repo}:latest-standard-amd64" "${repo}:latest-standard-arm64"
          echo "::notice::manifest ${repo}:latest -> standard"

          # latest-<arch> も standard の別名（単一プラットフォーム）
          for a in amd64 arm64; do
            docker buildx imagetools create -t "${repo}:latest-${a}" \
              "${repo}:latest-standard-${a}"
            echo "::notice::tag ${repo}:latest-${a} -> standard-${a}"
          done

  # Cosign のキーレス署名（Sigstore OIDC）。
  #
  # **鍵を持たない。** GitHub Actions の OIDC トークンで署名し、
  # 署名は Rekor の透明性ログに載る。Secrets を1つも増やさずに済む
  # （鍵を置くと、その鍵の保管と失効の運用が必要になる）。
  #
  # 署名するのはタグではなくダイジェスト。タグは動くので、
  # タグに対する署名は「どのイメージを署名したか」を特定できない。
  #
  # 検証（利用者側。cosign v3 以降が要る。v2 では no signatures found になる）:
  #   cosign verify ishinokazuki/kimigayo-os:3.1.0 \
  #     --certificate-identity-regexp '^https://github.com/Kazuki-0731/Kimigayo/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  sign:
    name: Sign images with Cosign
    needs: [meta, create-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write      # キーレス署名に必要（これが無いと OIDC が取れない）

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # create-manifest が作ったタグをすべて署名する。
      # 1つでも漏らすと「署名されているタグと、されていないタグ」が
      # 混在し、利用者側の検証が通らないものが出る。
      - name: Sign all published tags by digest
        run: |
          set -euo pipefail
          repo="${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          v="${{ needs.meta.outputs.version }}"

          # create-manifest が作るタグをすべて並べる。1つでも漏らすと
          # 「署名されているタグとされていないタグ」が混在する。
          tags=()
          for variant in minimal standard extended; do
            tags+=("${v}-${variant}" "latest-${variant}")
            for a in amd64 arm64; do
              tags+=("${v}-${variant}-${a}" "latest-${variant}-${a}")
            done
          done
          tags+=("${v}" "latest" "latest-amd64" "latest-arm64")

          # タグ名ではなくダイジェストを署名する（タグは動くので、
          # タグへの署名では「どのイメージを署名したか」が特定できない）。
          #
          # --format は古い buildx に無いので Digest: 行を読む。
          # 複数のタグが同じダイジェストを指すため重複を落とす
          # （実測で 22 タグ → 9 ダイジェスト）。
          digests=()
          for t in "${tags[@]}"; do
            d=$(docker buildx imagetools inspect "${repo}:${t}" \
                  | awk '/^Digest:/{print $2; exit}')
            if [ -z "$d" ]; then
              echo "::error::could not resolve digest for ${repo}:${t}"
              exit 1
            fi
            echo "${t} -> ${d}"
            digests+=("$d")
          done

          mapfile -t uniq < <(printf '%s\n' "${digests[@]}" | sort -u)
          echo "::notice::${#tags[@]} tags -> ${#uniq[@]} unique digests"

          for d in "${uniq[@]}"; do
            cosign sign --yes "${repo}@${d}"
            echo "::notice::signed ${repo}@${d}"
          done

      # 署名したものが実際に検証できるかを、その場で確かめる。
      # 「署名した」と「検証できる」は別。
      - name: Verify the signature we just made
        run: |
          set -euo pipefail
          repo="${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          v="${{ needs.meta.outputs.version }}"
          cosign verify "${repo}:${v}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "::notice::cosign verify OK for ${repo}:${v}"

  create-github-release:
    name: Create GitHub Release
    needs: [meta, sources, verify-and-push, create-manifest, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts/
          pattern: kimigayo-*

      - name: Download SBOMs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: sboms/
          pattern: sbom-*

      - name: Download source archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sources
          path: sources/

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts/ -name "*.tar.gz" -exec cp {} release-assets/ \;
          # SBOM（CycloneDX）は 3 バリアント × 2 アーキの 6 本。欠けたら出さない
          find sboms/ -name "*.cdx.json" -exec cp {} release-assets/ \;
          n=$(find release-assets -name '*.cdx.json' | wc -l)
          [ "$n" -eq 6 ] || { echo "::error::expected 6 SBOMs, got $n"; exit 1; }
          # 対応するソース（上流 3 本 + リポジトリの archive）。欠けたら出さない
          cp sources/* release-assets/
          n=$(find sources -type f | wc -l)
          [ "$n" -eq 4 ] || { echo "::error::expected 4 source archives, got $n"; exit 1; }
          cd release-assets
          sha256sum *.tar.gz *.tar.bz2 > SHA256SUMS
          sha512sum *.tar.gz *.tar.bz2 > SHA512SUMS
          ls -lh
          cat SHA256SUMS

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          PREVIOUS_TAG="$(git tag --sort=-v:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -2 | tail -1)"
          [ -n "$PREVIOUS_TAG" ] || PREVIOUS_TAG="$(git rev-list --max-parents=0 HEAD | head -1)"
          echo "::notice::release notes from ${PREVIOUS_TAG}"

          cat > release-notes.md <<EOF
          # Kimigayo OS v${VERSION}

          ## 📦 Available Images

          \`\`\`bash
          docker pull ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${VERSION}-standard
          docker pull ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${VERSION}-minimal
          docker pull ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${VERSION}-extended
          \`\`\`

          いずれも x86_64 / arm64 のマルチアーキマニフェストです。

          ## ✅ 検証したこと

          全バリアント × 両アーキテクチャで、**公開するイメージそのものを
          起動して**次を確認しています（\`scripts/verify-image.sh\`）。

          - 動的リンカが rootfs 内で解決する
          - OpenRC の実行ファイル5つがロードできて動く（\`rc-update show\` を含む）
          - BusyBox 本体が上書きされていない／アプレット数がバリアントと一致
          - \`/tmp\`・\`/run\`・\`/var/tmp\` などが存在し、スティッキービットが付いている
          - setuid/setgid バイナリと AppleDouble（\`._*\`）が無い
          - 全 ELF が PIE・Full RELRO（BIND_NOW）・非実行スタック
          - 入っている構成要素の版が \`versions.mk\` と一致し、
            \`/etc/os-release\` の版がこのリリースの版と一致する
          - 秘密情報が無く、CVE の照合（\`scripts/scan-image.sh\`。
            イメージ内のバイナリから SBOM を作って Grype で照合）を通過した

          ## 🔏 署名と SBOM

          公開したイメージは Cosign でキーレス署名しています。
          検証には **cosign v3 以上**が必要です（v2 では no signatures found になります）。

          \`\`\`bash
          cosign verify ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${VERSION} \\
            --certificate-identity-regexp '^https://github.com/Kazuki-0731/Kimigayo/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          SBOM（CycloneDX、3 バリアント × 2 アーキの 6 本）をこの Release に添付しています。

          ## 📜 ライセンスとソース

          イメージには BusyBox（GPL-2.0-only）・musl（MIT）・OpenRC（BSD-2-Clause）・
          libcap（BSD-3-Clause）が入っています。条文はイメージの
          \`/usr/share/licenses/\` にあります。対応するソースとして、上流の
          tarball 3 本と、パッチ・BusyBox の config・ビルドスクリプトを含む
          \`kimigayo-${VERSION}-src.tar.gz\` をこの Release に添付しています。

          ## 🔄 Changes Since ${PREVIOUS_TAG}

          EOF

          if git log "${PREVIOUS_TAG}..HEAD" --oneline --grep='Merge pull request' | grep -q .; then
            echo "### Pull Requests" >> release-notes.md
            git log "${PREVIOUS_TAG}..HEAD" --oneline --grep='Merge pull request' |
              sed -n 's/.*Merge pull request #\([0-9]*\).*/\1/p' |
              sort -rn | uniq | while read -r pr; do
                # set -e 下で gh が失敗するとリリースノート生成ごと
                # 止まる。タイトルが引けないのは公開を止める理由では
                # ないので、ここだけフォールバックさせる（番号は残る）。
                title="$(gh pr view "$pr" --json title --jq '.title' || true)"
                echo "- #${pr}: ${title:-（タイトル取得失敗）}" >> release-notes.md
              done
          else
            echo "### Commits" >> release-notes.md
            git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s (%h)" >> release-notes.md
            echo "" >> release-notes.md
          fi

          cat >> release-notes.md <<'EOF'

          ## 📚 Documentation

          - [Installation Guide](https://github.com/Kazuki-0731/Kimigayo/blob/main/docs/user/INSTALLATION.md)
          - [Quick Start Guide](https://github.com/Kazuki-0731/Kimigayo/blob/main/docs/user/QUICKSTART.md)
          - [Docker Hub](https://hub.docker.com/r/ishinokazuki/kimigayo-os)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Kimigayo OS v${{ needs.meta.outputs.version }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 手動実行（ビルドと検証だけ）では create-manifest / sign /
  # create-github-release が skipped になる。それを「失敗」と数えない。
  # 逆にタグの push では、この3つまで success でなければ失敗として通知する。
  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [meta, sources, build, verify-and-push, create-manifest, sign, create-github-release]
    if: always()
    timeout-minutes: 5
    permissions: {}
    # ジョブの env では env コンテキストを参照できないので、PUBLISH と同じ
    # 条件をここに直接書いている。
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      OK: ${{ needs.sources.result == 'success' && needs.build.result == 'success' && needs.verify-and-push.result == 'success' && (!(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (needs.create-manifest.result == 'success' && needs.sign.result == 'success' && needs.create-github-release.result == 'success')) }}
    steps:
      # 断言しない。各ジョブの結果をそのまま並べる。
      # 以前は「Docker Hub: ✅ Images pushed」と書いていたが、
      # ジョブが落ちていても出る文面だった。
      - name: Send notification
        if: env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ env.OK == 'true' && 'success' || 'failure' }}
          title: ${{ env.PUBLISH == 'true' && (env.OK == 'true' && '🎉 Release Success' || '❌ Release Failed') || (env.OK == 'true' && '✅ Release build verified (not published)' || '❌ Release build failed (not published)') }}
          description: |
            **Kimigayo OS v${{ needs.meta.outputs.version }}**${{ env.PUBLISH != 'true' && '（workflow_dispatch: ビルドと検証のみ。Docker Hub には push していない）' || '' }}

            • Corresponding source: ${{ needs.sources.result }}
            • Build (3 variants x 2 arch): ${{ needs.build.result }}
            • Verify and push: ${{ needs.verify-and-push.result }}
            • Multi-arch manifests: ${{ needs.create-manifest.result }}
            • Cosign signature: ${{ needs.sign.result }}
            • GitHub Release: ${{ needs.create-github-release.result }}

            ${{ env.PUBLISH == 'true' && format('🐳 `docker pull ishinokazuki/kimigayo-os:{0}-standard`', needs.meta.outputs.version) || '' }}
            ${{ env.PUBLISH == 'true' && format('📦 https://github.com/Kazuki-0731/Kimigayo/releases/tag/v{0}', needs.meta.outputs.version) || '' }}
          username: 'Kimigayo Release Bot'
