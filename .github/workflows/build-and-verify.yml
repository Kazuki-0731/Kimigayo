name: Build and Verify

# main への push と PR のたびに、文書・スクリプトの点検、pytest、
# 全バリアント × 両アーキのビルドとイメージ検証を回す（公開はしない）。
# 2026-10-15 まで ci.yml という名前だった（名前で中身が分からなかったので改名）。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # base-image-update.yml が作る更新 PR のブランチで CI を回すため。
  # GITHUB_TOKEN で作った PR・push ではワークフローが起動しない
  # （workflow_dispatch だけは例外）ので、あちらが明示的にここを起動する。
  workflow_dispatch:

# 連続して push したときに前の run を止める。
# 2026-10-09 に2回、前の run が走り続けて CI 時間を二重に消費し、
# 手で gh run cancel した。main では前の結果も見たいことがあるが、
# ビルドが 1 run あたり数十分かかるのでキャンセルを既定にする。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-unreleased.py が前回のタグを git describe で探すため
          fetch-depth: 0

      # 追跡ファイル基準でリンクを検査する。手元では .gitignore された
      # ファイルがあるせいで気づけない種類の壊れ方なので CI で止める。
      - name: Check markdown links
        run: python3 scripts/check-links.py

      # 2026-10-12 の横串監査で直した古い記述が戻ってきていないか。
      # 規則は scripts/check-stale-docs.py の RULES にある。
      - name: Check for stale statements in docs
        run: python3 scripts/check-stale-docs.py

      # 前回のタグから公開イメージの中身に効くファイルが変わったのに、
      # CHANGELOG の [Unreleased] に区分（SPECIFICATION.md 10.2）が無ければ止める。
      # 「次の版」と区分の食い違いも見る。
      - name: Check CHANGELOG [Unreleased] against changes since the last tag
        run: python3 scripts/check-unreleased.py

      # ローカルの make shellcheck-scan と同じ対象・同じ重大度で回す
      # （Makefile の SHELLCHECK_TARGETS）。
      #
      # 以前は ludeeus/action-shellcheck に additional_files: '.claude/hooks' を
      # 渡していたが、このアクションは additional_files を ./scripts の中での
      # find -name のパターンとして扱うため、**.claude/hooks/ は検査されて
      # いなかった**（CI ログで `-o -name *.claude/hooks` を確認、2026-10-12）。
      #
      # shellcheck は版をダイジェストで固定したイメージで動かす
      # （Makefile のフォールバックと同じ koalaman/shellcheck）。
      # ランナーにプリインストールの shellcheck は版が勝手に変わる。
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            --severity=warning \
            scripts/*.sh scripts/lib/*.sh .claude/hooks/*.sh

  # pytest はビルド結果に依存しないので matrix から外す。
  # 以前は build ジョブの make test と独立した test ジョブの両方で
  # 走っており、1 run で 12 回（6 セル × 2）同じテストを回していた。
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build build-environment image
        run: docker compose build

      # docker-compose.yml の working_dir は build-system なので
      # -w でリポジトリルートを指定する。これが無いと
      # "file or directory not found: tests/unit/" で落ちる。
      - name: Run unit tests
        run: |
          docker compose run --rm -w /build/kimigayo kimigayo-build \
            pytest tests/unit -q

  # **カーネルは CI でビルドしない。**
  #
  # Kimigayo の成果物は rootfs だけを詰めた Docker イメージで、
  # **カーネルはイメージに入らない**（コンテナはホストのカーネルで動く）。
  # 想定する使い方も VPS 上の Docker コンテナなので、CI が毎回
  # カーネルを作っても検証しているものが成果物に含まれない。
  # 一方で所要時間は 1 run あたり数十分増える（実測で arm64 standard が
  # 47 分 → カーネル抜きで大幅短縮）。
  #
  # カーネルをビルドしたいときは次のどちらかで行う:
  #   - ローカル: `docker compose run --rm kimigayo-build make kernel TARGET_ARCH=<arch>`
  #     （kernel ターゲットはコンテナ側の build-system/Makefile にしかない）
  #   - CI: Actions から manual-build.yml を build_kernel=true で実行
  build-and-verify:
    name: Build and Verify
    needs: [shellcheck]
    strategy:
      # 1つ落ちると他の5つがキャンセルされ、何が本当に壊れているのか
      # 分からなくなる（2026-10-09 の run 37869425207 では
      # pytest のパス指定ミス1件で残り全部がキャンセルされ、
      # カーネル 6.18.55 が arm64 で通るのかが分からなかった）。
      fail-fast: false
      matrix:
        variant: [minimal, standard, extended]
        arch: [x86_64, arm64]
    uses: ./.github/workflows/build-workflow.yml
    with:
      variant: ${{ matrix.variant }}
      arch: ${{ matrix.arch }}
      build_kernel: false
      upload_artifacts: false

  # Trivy のファイルシステムスキャンはビルド結果に依存しない。
  # 以前は needs: build-and-test で最長 47 分待っていた。
  #
  # イメージスキャンはここでやらない。Kimigayo は scratch 上の手組み
  # rootfs でパッケージデータベースを持たないため、Trivy は対象を1つも
  # 識別できない（実測で Target: - / Not scanned / Metadata.OS: null）。
  # 「脆弱性 0 件」ではなく「スキャンしていない」なので、
  # 走らせると誤った安心を与える。
  # → CLAUDE.md「セキュリティ」節、.claude/skills/security-review/
  security-scan:
    name: Security Scan (filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [shellcheck, tests, build-and-verify, security-scan]
    if: always() && github.event_name == 'push'
    timeout-minutes: 5
    permissions: {}
    # secrets コンテキストは step の if では参照できないので env に移す。
    # webhook が未設定のリポジトリ（fork など）でジョブを失敗させない。
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      # 文面で断言しない。
      # 以前は「Security Scan: ✅ No critical issues」と書いていたが、
      # Trivy の fs スキャンは SARIF を出すだけで exit-code を指定して
      # いないためジョブは落ちない。つまり中身を見ずに「問題なし」と
      # 言っていた。いまは各ジョブの結果だけを並べる。
      - name: Send notification
        if: env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ (needs.shellcheck.result == 'success' && needs.tests.result == 'success' && needs.build-and-verify.result == 'success' && needs.security-scan.result == 'success') && 'success' || 'failure' }}
          title: >-
            ${{ (needs.shellcheck.result == 'success' && needs.tests.result == 'success' && needs.build-and-verify.result == 'success' && needs.security-scan.result == 'success') && '✅ CI Success' || '❌ CI Failed' }}
          description: |
            **Kimigayo OS CI**

            • ShellCheck: ${{ needs.shellcheck.result }}
            • Tests: ${{ needs.tests.result }}
            • Build and Verify (3 variants x 2 arch): ${{ needs.build-and-verify.result }}
            • Trivy filesystem scan: ${{ needs.security-scan.result }}
              （SARIF を Security タブへ送るだけで、結果でジョブは落ちない）

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          username: 'Kimigayo CI Bot'
