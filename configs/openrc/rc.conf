# Kimigayo OS - OpenRC Configuration
# ビルドでは使われていない。イメージの /etc/rc.conf は scripts/build-rootfs.sh の
# heredoc が作る（値はここと同じ）。

# 並列起動を有効化
rc_parallel="YES"

# rc の処理全体を /var/log/rc.log に記録する（rc_logger）。
# rc_log_level というキーは OpenRC 0.63.2 に存在しないので、下の行は効いていない
rc_logger="YES"
rc_log_level="warn"

# 停止のタイムアウト（ハングアップ防止）
rc_timeout_stopsec=30

# cgroup サポート（コンテナ環境用）
rc_cgroup_mode="hybrid"
rc_controller_cgroups="YES"

# ホットプラグを許可するサービスのパターン。OpenRC の rc.conf の説明では、
# 値を設定すると「どのパターンにも一致しないサービス」も許可される。
# つまりこれは無効化ではない（無効化するなら未設定か空にする）
rc_hotplug="hwclock net.lo"

# 依存関係の厳密チェックを緩和（同じものを提供するサービスのどれか1つが
# 起動すれば依存を満たしたとみなす）
rc_depend_strict="NO"

# クラッシュしたサービスの扱い
rc_crashed_stop="NO"
rc_crashed_start="YES"

# コンソールで UTF-8 を使う
unicode="YES"
